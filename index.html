<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;

}

// =====================================================
// GAME VARIABLES
// =====================================================

let level=0;

let score=0;

let maxHealth=20;

let health=20;

let lives=3;

let camera=0;

let gameWon=false;

let gameOver=false;

let message="";

let messageTimer=0;

let player;

let coins=[];

let enemies=[];

let portal={};


// =====================================================
// LOAD LEVEL
// =====================================================

function loadLevel(number){

    level=number;

    const L=levels[level];


    player={

        x:80,
        y:400,

        width:34,
        height:48,

        vx:0,
        vy:0,

        speed:7,

        jumpPower:-15,

        ground:false,

        checkpoint:80

    };


    coins=L.coins.map(c=>({

        x:c[0],
        y:c[1],

        collected:false

    }));


    enemies=L.enemies.map(e=>({

        x:e[0],
        y:e[1],

        width:e[2],
        height:e[3],

        min:e[4],
        max:e[5],

        vx:e[6],

        health:5,

        maxHealth:5,

        dead:false

    }));


    portal={

        x:L.portal[0],

        y:L.portal[1],

        width:50,

        height:70

    };


    camera=0;

    message=L.name;

    messageTimer=100;

}


loadLevel(0);


// =====================================================
// KEYBOARD
// =====================================================

let keyboardLeft=false;
let keyboardRight=false;
let keyboardJump=false;
let keyboardAttack=false;


document.addEventListener("keydown",function(e){

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        keyboardLeft=true;

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        keyboardRight=true;

    }


    if(
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w" ||
        e.key===" "
    ){

        keyboardJump=true;

        e.preventDefault();

    }


    if(e.key.toLowerCase()==="f"){

        keyboardAttack=true;

    }


    if(e.key.toLowerCase()==="r"){

        restartGame();

    }

});


document.addEventListener("keyup",function(e){

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        keyboardLeft=false;

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        keyboardRight=false;

    }


    if(
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w" ||
        e.key===" "
    ){

        keyboardJump=false;

    }


    if(e.key.toLowerCase()==="f"){

        keyboardAttack=false;

    }

});


// =====================================================
// MULTI-TOUCH CONTROLS
// =====================================================

const fingers=new Map();

let touchLeft=false;
let touchRight=false;
let touchJump=false;
let touchAttack=false;


canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        canvas.setPointerCapture(e.pointerId);

        fingers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );

        updateTouchControls();

    }
);


canvas.addEventListener(
    "pointermove",
    function(e){

        e.preventDefault();

        if(fingers.has(e.pointerId)){

            fingers.set(
                e.pointerId,
                {
                    x:e.clientX,
                    y:e.clientY
                }
            );

            updateTouchControls();

        }

    }
);


canvas.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        fingers.delete(e.pointerId);

        updateTouchControls();

    }
);


canvas.addEventListener(
    "pointercancel",
    function(e){

        fingers.delete(e.pointerId);

        updateTouchControls();

    }
);


function updateTouchControls(){

    touchLeft=false;
    touchRight=false;
    touchJump=false;
    touchAttack=false;


    for(
        const finger of fingers.values()
    ){

        const x=finger.x;
        const y=finger.y;


        if(y>H-155){

            if(x<110){

                touchLeft=true;

            }

            else if(x<215){

                touchRight=true;

            }

            else if(
                x>W-215 &&
                x<W-110
            ){

                touchAttack=true;

            }

            else if(x>=W-110){

                touchJump=true;

            }

        }

    }

}


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

    return(

        a.x < b.x+b.width &&
        a.x+a.width > b.x &&
        a.y < b.y+b.height &&
        a.y+a.height > b.y

    );

}


// =====================================================
// DAMAGE
// =====================================================

function damage(amount){

    // Take HP damage
    health-=amount;


    // Player is still alive
    if(health>0){

        message="-"+amount+" HP!";

        messageTimer=35;

        return;

    }


    // HP reached zero
    health=0;


    // Lose ONE life
    lives--;


    // No lives left
    if(lives<=0){

        lives=0;

        gameOver=true;

        return;

    }


    // =================================================
    // RESPAWN
    // =================================================

    player.x=player.checkpoint;

    player.y=300;

    player.vx=0;

    player.vy=0;


    // IMPORTANT:
    // FULLY RESTORE CURRENT MAX HP

    health=maxHealth;


    message="YOU LOST A LIFE!";

    messageTimer=70;

}


// =====================================================
// COMPLETE LEVEL
// =====================================================

function completeLevel(){

    // Last level
    if(level>=levels.length-1){

        gameWon=true;

        return;

    }


    // Go to next level
    level++;


    // +10 maximum HP
    maxHealth+=10;


    // +10 healing
    health+=10;


    // Don't exceed maximum
    if(health>maxHealth){

        health=maxHealth;

    }


    loadLevel(level);


    message="+10 MAX HP  +10 HP!";

    messageTimer=90;

}


// =====================================================
// ATTACK
// =====================================================

let attackCooldown=0;


// Wooden sword damage
const swordDamage=3;


// Attack every 0.3 seconds
// At 60 FPS = 18 frames

function attack(){

    if(attackCooldown>0){

        return;

    }


    attackCooldown=18;


    const attackRange=65;


    for(
        const enemy of enemies
    ){

        if(enemy.dead)
            continue;


        const dx=Math.abs(
            player.x+
            player.width/2-
            (
                enemy.x+
                enemy.width/2
            )
        );


        const dy=Math.abs(
            player.y+
            player.height/2-
            (
                enemy.y+
                enemy.height/2
            )
        );


        if(
            dx<attackRange &&
            dy<70
        ){

            enemy.health-=swordDamage;


            message="⚔️ HIT!";

            messageTimer=20;


            if(enemy.health<=0){

                enemy.health=0;

                enemy.dead=true;

                score+=2;

                message="+2 MONSTER!";

                messageTimer=30;

            }

        }

    }

}


// =====================================================
// UPDATE
// =====================================================

function update(){

    if(gameWon || gameOver){

        return;

    }


    const L=levels[level];


    const moveLeft=
        keyboardLeft ||
        touchLeft;


    const moveRight=
        keyboardRight ||
        touchRight;


    const doJump=
        keyboardJump ||
        touchJump;


    const doAttack=
        keyboardAttack ||
        touchAttack;


    // Attack
    if(doAttack){

        attack();

    }


    if(attackCooldown>0){

        attackCooldown--;

    }


    // =================================================
    // MOVEMENT
    // =================================================

    if(moveLeft){

        player.vx-=0.8;

    }


    if(moveRight){

        player.vx+=0.8;

    }


    if(
        !moveLeft &&
        !moveRight
    ){

        player.vx*=0.82;

    }


    player.vx=Math.max(
        -player.speed,
        Math.min(
            player.speed,
            player.vx
        )
    );


    // =================================================
    // JUMP
    // =================================================

    if(
        doJump &&
        player.ground
    ){

        player.vy=player.jumpPower;

        player.ground=false;

    }


    // =================================================
    // GRAVITY
    // =================================================

    player.vy+=0.58;


    if(player.vy>17){

        player.vy=17;

    }


    player.x+=player.vx;

    player.y+=player.vy;


    player.x=Math.max(
        0,
        Math.min(
            3700,
            player.x
        )
    );


    player.ground=false;


    // =================================================
    // PLATFORM COLLISION
    // =================================================

    for(
        const p of L.platforms
    ){

        const platform={

            x:p[0],
            y:p[1],
            width:p[2],
            height:p[3]

        };


        if(
            collision(
                player,
                platform
            )
        ){

            // Landing
            if(
                player.vy>=0 &&
                player.y+
                player.height-
                player.vy
                <=platform.y+8
            ){

                player.y=
                    platform.y-
                    player.height;

                player.vy=0;

                player.ground=true;

            }


            // Hit underside
            else if(
                player.vy<0 &&
                player.y-
                player.vy
                >=
                platform.y+
                platform.height
            ){

                player.y=
                    platform.y+
                    platform.height;

                player.vy=0;

            }

        }

    }


    // =================================================
    // CHECKPOINTS
    // =================================================

    if(player.x>1500){

        player.checkpoint=1450;

    }


    if(player.x>2600){

        player.checkpoint=2550;

    }


    // =================================================
    // COINS
    // =================================================

    for(
        const coin of coins
    ){

        if(
            !coin.collected &&
            Math.hypot(
                player.x+17-coin.x,
                player.y+24-coin.y
            )<30
        ){

            coin.collected=true;

            score++;

            message="+1 COIN!";

            messageTimer=30;

        }

    }


    // =================================================
    // ENEMIES
    // =================================================

    for(
        const enemy of enemies
    ){

        enemy.x+=enemy.vx;


        if(
            enemy.x<enemy.min ||
            enemy.x>enemy.max
        ){

            enemy.vx*=-1;

        }


        if(
            collision(
                player,
                enemy
            )
        ){

            // STOMP
            if(
                player.vy>0 &&
                player.y+
                player.height<
                enemy.y+20
            ){

                enemy.health-=2;

                player.vy=-10;

                message="STOMP!";

                messageTimer=20;


                if(enemy.health<=0){

                    enemy.health=0;

                    enemy.dead=true;

                    score+=2;

                }

            }

            else{

                damage(5);

            }

        }

    }


    enemies=
        enemies.filter(
            e=>!e.dead
        );


    // =================================================
    // PORTAL
    // =================================================

    if(
        collision(
            player,
            portal
        )
    ){

        completeLevel();

    }


    // =================================================
    // FALLING
    // =================================================

    if(player.y>H+400){

        damage(5);

    }


    // =================================================
    // CAMERA
    // =================================================

    camera+=
        (
            player.x-
            W*0.35-
            camera
        )*0.1;


    camera=Math.max(
        0,
        Math.min(
            3700-W,
            camera
        )
    );


    if(messageTimer>0){

        messageTimer--;

    }

}


// =====================================================
// DRAW
// =====================================================

function draw(){

    const L=levels[level];


    // =================================================
    // SKY
    // =================================================

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        L.sky1
    );


    gradient.addColorStop(
        1,
        L.sky2
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(
        -camera,
        0
    );


    // =================================================
    // BACKGROUND
    // =================================================

    ctx.fillStyle=
        "rgba(255,255,255,.13)";


    for(
        let i=-1;
        i<10;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i*600,
            600
        );

        ctx.lineTo(
            i*600+300,
            180
        );

        ctx.lineTo(
            i*600+650,
            600
        );

        ctx.fill();

    }


    // =================================================
    // PLATFORMS
    // =================================================

    for(
        const p of L.platforms
    ){

        ctx.fillStyle="#263244";


        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            p[3]
        );


        ctx.fillStyle=
            level===3
            ? "#fb923c"
            : "#22c55e";


        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            7
        );

    }


    // =================================================
    // COINS
    // =================================================

    for(
        const coin of coins
    ){

        if(coin.collected)
            continue;


        ctx.fillStyle="#facc15";


        ctx.beginPath();

        ctx.arc(
            coin.x,
            coin.y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="white";


        ctx.beginPath();

        ctx.arc(
            coin.x-3,
            coin.y-3,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    // =================================================
    // ENEMIES
    // =================================================

    for(
        const enemy of enemies
    ){

        ctx.fillStyle="#ef4444";


        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.width,
            enemy.height
        );


        // Eyes

        ctx.fillStyle="#111827";


        ctx.fillRect(
            enemy.x+5,
            enemy.y+9,
            7,
            7
        );


        ctx.fillRect(
            enemy.x+19,
            enemy.y+9,
            7,
            7
        );


        // Health bar background

        ctx.fillStyle="#111827";


        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.width,
            6
        );


        // Health bar

        ctx.fillStyle="#22c55e";


        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.width*
            (
                enemy.health/
                enemy.maxHealth
            ),
            6
        );

    }


    // =================================================
    // PORTAL
    // =================================================

    ctx.fillStyle="white";


    ctx.fillRect(
        portal.x,
        portal.y,
        5,
        portal.height
    );


    ctx.fillStyle="#a855f7";


    ctx.beginPath();


    ctx.moveTo(
        portal.x+5,
        portal.y
    );


    ctx.lineTo(
        portal.x+50,
        portal.y+18
    );


    ctx.lineTo(
        portal.x+5,
        portal.y+36
    );


    ctx.fill();


    // =================================================
    // PLAYER
    // =================================================

    ctx.fillStyle="#7c3aed";


    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    // Eyes

    ctx.fillStyle="white";


    ctx.fillRect(
        player.x+6,
        player.y+10,
        7,
        7
    );


    ctx.fillRect(
        player.x+20,
        player.y+10,
        7,
        7
    );


    // Wooden sword

    ctx.fillStyle="#d1d5db";


    ctx.fillRect(
        player.x+
        player.width,
        player.y+22,
        30,
        7
    );


    ctx.restore();


    // =================================================
    // HUD
    // =================================================

    ctx.fillStyle=
        "rgba(0,0,0,.65)";


    ctx.fillRect(
        10,
        10,
        Math.min(W-20,420),
        105
    );


    ctx.fillStyle="white";


    ctx.font="bold 18px Arial";


    ctx.fillText(
        "LEVEL "+
        (level+1)+
        " / "+
        levels.length+
        "  "+
        L.name,
        22,
        36
    );


    ctx.font="14px Arial";


    // HEALTH AND LIVES ARE SEPARATE

    ctx.fillText(
        "🪙 "+
        score+
        "     ❤️ "+
        health+
        "/"+
        maxHealth+
        "     💀 "+
        lives,
        22,
        63
    );


    // =================================================
    // HEALTH BAR
    // =================================================

    const healthBarWidth=
        Math.min(
            W-44,
            390
        );


    ctx.fillStyle="#111827";


    ctx.fillRect(
        22,
        76,
        healthBarWidth,
        14
    );


    ctx.fillStyle="#22c55e";


    if(maxHealth>0){

        ctx.fillRect(
            22,
            76,
            healthBarWidth*
            (
                health/
                maxHealth
            ),
            14
        );

    }


    // =================================================
    // TOUCH BUTTONS
    // =================================================

    const size=82;

    const gap=12;

    const y=H-105;


    drawButton(
        15,
        y,
        size,
        touchLeft
    );


    drawButton(
        15+size+gap,
        y,
        size,
        touchRight
    );


    drawButton(
        W-15-size*2-gap,
        y,
        size,
        touchAttack
    );


    drawButton(
        W-15-size,
        y,
        size,
        touchJump
    );


    ctx.fillStyle="white";

    ctx.font="bold 34px Arial";


    ctx.fillText(
        "◀",
        37,
        y+53
    );


    ctx.fillText(
        "▶",
        37+size+gap,
        y+53
    );


    ctx.fillText(
        "⚔",
        W-15-size*2-gap+23,
        y+54
    );


    ctx.fillText(
        "▲",
        W-15-size+25,
        y+54
    );


    // =================================================
    // MESSAGE
    // =================================================

    if(messageTimer>0){

        ctx.fillStyle=
            "rgba(0,0,0,.65)";


        ctx.fillRect(
            W/2-130,
            100,
            260,
            50
        );


        ctx.fillStyle="white";

        ctx.textAlign="center";

        ctx.font="bold 20px Arial";


        ctx.fillText(
            message,
            W/2,
            132
        );


        ctx.textAlign="left";

    }


    // =================================================
    // GAME OVER
    // =================================================

    if(gameOver){

        ctx.fillStyle=
            "rgba(0,0,0,.88)";


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.fillStyle="white";

        ctx.textAlign="center";


        ctx.font=
            "bold 38px Arial";


        ctx.fillText(
            "💀 GAME OVER",
            W/2,
            H/2-100
        );


        ctx.font="20px Arial";


        ctx.fillText(
            "Level reached: "+
            (level+1),
            W/2,
            H/2-55
        );


        ctx.fillText(
            "Coins: "+
            score,
            W/2,
            H/2-20
        );


        ctx.fillText(
            "Lives: "+
            lives,
            W/2,
            H/2+15
        );


        const bw=260;

        const bh=60;

        const bx=W/2-bw/2;

        const by=H/2+50;


        ctx.fillStyle="#7c3aed";


        ctx.beginPath();


        ctx.roundRect(
            bx,
            by,
            bw,
            bh,
            15
        );


        ctx.fill();


        ctx.strokeStyle="white";

        ctx.lineWidth=3;


        ctx.stroke();


        ctx.fillStyle="white";

        ctx.font=
            "bold 22px Arial";


        ctx.fillText(
            "PLAY AGAIN",
            W/2,
            by+38
        );


        ctx.textAlign="left";

    }


    // =================================================
    // WIN SCREEN
    // =================================================

    if(gameWon){

        ctx.fillStyle=
            "rgba(0,0,0,.88)";


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.fillStyle="white";

        ctx.textAlign="center";


        ctx.font=
            "bold 36px Arial";


        ctx.fillText(
            "🏆 YOU WON!",
            W/2,
            H/2-90
        );


        ctx.font="20px Arial";


        ctx.fillText(
            "You cleared every level!",
            W/2,
            H/2-50
        );


        ctx.fillText(
            "Total coins: "+
            score,
            W/2,
            H/2-15
        );


        const bw=260;

        const bh=60;

        const bx=W/2-bw/2;

        const by=H/2+30;


        ctx.fillStyle="#7c3aed";


        ctx.beginPath();


        ctx.roundRect(
            bx,
            by,
            bw,
            bh,
            15
        );


        ctx.fill();


        ctx.strokeStyle="white";

        ctx.lineWidth=3;


        ctx.stroke();


        ctx.fillStyle="white";

        ctx.font=
            "bold 22px Arial";


        ctx.fillText(
            "PLAY AGAIN",
            W/2,
            by+38
        );


        ctx.textAlign="left";

    }

}


// =====================================================
// BUTTON DRAWING
// =====================================================

function drawButton(
    x,
    y,
    size,
    active
){

    ctx.fillStyle=
        active
        ? "rgba(255,255,255,.45)"
        : "rgba(255,255,255,.18)";


    ctx.strokeStyle=
        "rgba(255,255,255,.75)";


    ctx.lineWidth=2;


    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        size,
        size,
        18
    );


    ctx.fill();

    ctx.stroke();

}


// =====================================================
// RESTART GAME
// =====================================================

function restartGame(){

    score=0;

    lives=3;

    maxHealth=20;

    health=20;

    level=0;

    camera=0;

    gameWon=false;

    gameOver=false;

    attackCooldown=0;

    message="MEADOW";

    messageTimer=100;


    loadLevel(0);

}


// =====================================================
// PLAY AGAIN BUTTON
// =====================================================

canvas.addEventListener(
    "pointerdown",
    function(e){

        if(
            !gameWon &&
            !gameOver
        ){

            return;

        }


        const bw=260;

        const bh=60;

        const bx=W/2-bw/2;

        let by;


        if(gameWon){

            by=H/2+30;

        }

        else{

            by=H/2+50;

        }


        if(
            e.clientX>=bx &&
            e.clientX<=bx+bw &&
            e.clientY>=by &&
            e.clientY<=by+bh
        ){

            restartGame();

        }

    }
);


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>
