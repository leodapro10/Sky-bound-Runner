<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,dpr=1;

function resize(){
    W=innerWidth;
    H=innerHeight;
    dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=W*dpr;
    canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",resize);
resize();


// =====================================================
// INPUT
// =====================================================

let touchLeft=false,touchRight=false,touchJump=false,touchAttack=false;
let keyLeft=false,keyRight=false,keyJump=false,keyAttack=false;
const fingers=new Map();

function getButtons(){
    const s=Math.min(100,Math.max(82,W*.14));
    const gap=14,bottom=20;

    return{
        left:{x:20,y:H-s-bottom,w:s,h:s},
        right:{x:20+s+gap,y:H-s-bottom,w:s,h:s},
        jump:{x:W-s*2-gap-20,y:H-s-bottom,w:s,h:s},
        attack:{x:W-s-20,y:H-s-bottom,w:s,h:s}
    };
}

function getPoint(e){
    const r=canvas.getBoundingClientRect();
    return{x:e.clientX-r.left,y:e.clientY-r.top};
}

function inside(p,b){
    return p.x>=b.x&&p.x<=b.x+b.w&&
           p.y>=b.y&&p.y<=b.y+b.h;
}

function updateTouchControls(){
    touchLeft=touchRight=touchJump=touchAttack=false;
    const b=getButtons();

    for(const p of fingers.values()){
        if(inside(p,b.left))touchLeft=true;
        if(inside(p,b.right))touchRight=true;
        if(inside(p,b.jump))touchJump=true;
        if(inside(p,b.attack))touchAttack=true;
    }
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    const p=getPoint(e);

    if(shopOpen){
        handleShopTouch(p);
        return;
    }

    if(nearShop&&!shopOpen&&inside(p,getShopOpenButton())){
        shopOpen=true;
        return;
    }

    fingers.set(e.pointerId,p);

    try{canvas.setPointerCapture(e.pointerId)}catch(_){}

    updateTouchControls();
},{passive:false});

canvas.addEventListener("pointermove",e=>{
    e.preventDefault();

    if(fingers.has(e.pointerId)){
        fingers.set(e.pointerId,getPoint(e));
        updateTouchControls();
    }
},{passive:false});

function pointerEnd(e){
    fingers.delete(e.pointerId);
    updateTouchControls();
}

canvas.addEventListener("pointerup",pointerEnd);
canvas.addEventListener("pointercancel",pointerEnd);

document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")keyLeft=true;
    if(k==="arrowright"||k==="d")keyRight=true;

    if(k==="arrowup"||k==="w"||k===" "){
        keyJump=true;
        e.preventDefault();
    }

    if(k==="j"||k==="f"||k==="z"){
        keyAttack=true;
        e.preventDefault();
    }

    if(k==="r")restart();
});

document.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")keyLeft=false;
    if(k==="arrowright"||k==="d")keyRight=false;
    if(k==="arrowup"||k==="w"||k===" ")keyJump=false;
    if(k==="j"||k==="f"||k==="z")keyAttack=false;
});


// =====================================================
// LEVEL GENERATION
// =====================================================

const levels=[];

const themes=[
    ["#60a5fa","#dbeafe","MEADOW"],
    ["#172033","#475569","CAVERNS"],
    ["#a78bfa","#f5d0fe","SKYLANDS"],
    ["#450a0a","#f97316","VOLCANO"]
];

for(let n=0;n<20;n++){

    const platforms=[];
    let x=0;

    for(let i=0;i<14;i++){

        let y;

        if(i===0){
            y=500;
        }else{
            const previous=platforms[i-1][1];

            /*
             * Keep platform changes reachable.
             * No platform is more than 60 pixels
             * above/below the previous one.
             */
            const change=((i*31+n*17)%121)-60;

            y=Math.max(350,Math.min(520,previous+change));
        }

        const width=310+((i*47+n*13)%90);

        platforms.push([x,y,width,45]);

        x+=width+55+((i*17+n*11)%35);
    }

    platforms.push([x,450,800,50]);

    const coins=[];

    for(const p of platforms){
        coins.push([
            p[0]+p[2]/2,
            p[1]-35
        ]);
    }

    const monsters=[];

    for(let m=0;m<6;m++){

        /*
         * Monster type progression.
         */
        let type=1;

        if(n>=5&&m>=2)type=2;
        if(n>=10&&m>=3)type=3;
        if(n>=15&&m>=4)type=4;

        /*
         * Store the PLATFORM INDEX instead of
         * a random X coordinate.
         *
         * This prevents monsters from spawning
         * underneath platforms.
         */
        const platformIndex=
            Math.min(
                1+m,
                platforms.length-2
            );

        monsters.push({
            platformIndex,
            type
        });
    }

    levels.push({
        name:themes[Math.floor(n/5)][2],
        sky1:themes[Math.floor(n/5)][0],
        sky2:themes[Math.floor(n/5)][1],
        platforms,
        coins,
        monsters,
        boss:n===9||n===19
    });
}

function rarityColor(r){

    if(r==="COMMON")return"#9ca3af";
    if(r==="UNCOMMON")return"#22c55e";
    if(r==="RARE")return"#3b82f6";
    if(r==="EPIC")return"#a855f7";

    if(r==="MYTHIC")return"#ef4444";

        y:250,
        width:34,
        height:48,
        vx:0,
        vy:0,
        speed:7,

        ground:false,
        maxHP:20+level*10,

        attacking:false,

    coins=L.coins.map(c=>({
        x:c[0],
        y:c[1],
        collected:false
    }));

    enemies=[];

    /*
     * SPAWN FIX:
     * Every monster is placed on the TOP of the
     * exact platform assigned to it.
     */
    for(const data of L.monsters){

        const s=monsterStats(data.type);

        const p=L.platforms[data.platformIndex];

        const spawnX=
            p[0]+
            40+
            Math.random()*
            Math.max(
                20,
                p[2]-s.width-80
            );

        enemies.push({
            x:spawnX,
            y:p[1]-s.height,

            width:s.width,
            height:s.height,

            type:data.type,

            hp:s.hp,
            maxHP:s.hp,

            damage:s.damage,
            rate:s.rate,
            speed:s.speed,

            color:s.color,

            vx:0,
            vy:0,

            ground:true,
            active:false,

            attackTimer:0,
            dead:false,
            boss:false
        });
    }


    // =================================================
    // BOSS
    // =================================================

    if(L.boss){

        const final=
            L.platforms[L.platforms.length-1];

        const secondBoss=level===19;

        const bw=secondBoss?204:170;
        const bh=secondBoss?288:240;

        enemies.push({
            x:final[0]+final[2]-bw-70,
            y:final[1]-bh,

            width:bw,
            height:bh,

            hp:secondBoss?50:35,
            maxHP:secondBoss?50:35,

            damage:secondBoss?30:20,
            rate:secondBoss?3.5:3,

            boss:true,
            active:false,

            attackTimer:0,
            warning:false,
            warningTimer:0,

            vy:0,
            ground:true,

    // =================================================
    // PORTAL
    // =================================================

    const final=
        L.platforms[L.platforms.length-1];

    portal={
        x:final[0]+final[2]-90,
        y:final[1]-75,
        width:50,
        height:75
    };


    // =================================================
    // SHOP
    // =================================================

    if((level+1)%5===0){

        shop={
            x:final[0]+190,
            y:final[1]-70,
            width:70,
            height:70
        };

        createShop();

    }else{
        shop=null;
        shopItems=[];

    message=

        :L.name+" — LEVEL "+(level+1);

    messageTimer=100;
}


// =====================================================
// SHOP CREATION
// =====================================================

function createShop(){

    shopItems=[];

    const available=[
        ...shopPool,
        ...weaponPool
    ].filter(item=>{
        return item.repeat||
               !purchasedPermanent.has(item.id);
    });


    /*
     * First decide whether each weapon appears
     * using its requested probability.
     *
     * The probabilities are:
     *
     * Uncommon 39%
     * Rare     25%
     * Epic     20%
     * Legendary10%
     * Mythic    5%
     * Secret  0.9%
     * Eternal 0.1%
     *
     * Together = 100%.
     */

    const weaponRoll=Math.random();

    let total=0;
    let selectedWeapon=null;

    for(const weapon of weaponPool){

        if(
            purchasedPermanent.has(
                weapon.id
            )
        )
            continue;

        total+=weapon.chance;

        if(
            weaponRoll<total
        ){

            selectedWeapon=weapon;
            break;
        }
    }


    /*
     * A weapon can occupy one of the three shop
     * slots. The other slots are normal shop items.
     */
    if(selectedWeapon){

        shopItems.push(selectedWeapon);
    }


    const remaining=
        available.filter(
            item=>item!==selectedWeapon
        );


    while(
        shopItems.length<3 &&
        remaining.length
    ){

        const index=
            Math.floor(
                Math.random()*remaining.length
            );

        shopItems.push(
            remaining[index]
        );

        remaining.splice(index,1);
    }


    /*
     * Shuffle the three choices.
     */
    shopItems.sort(
        ()=>Math.random()-.5
    );
}

// =====================================================
// SHOP TOUCH
// =====================================================

function handleShopTouch(p){

    if(!shopOpen)return;

    const cardW=Math.min(200,(W-50)/3);
    const gap=10;
    const total=cardW*3+gap*2;
    const start=W/2-total/2;

    for(let i=0;i<shopItems.length;i++){

        const x=start+i*(cardW+gap);
        const y=145;

        const buyBox={
            x:x+10,
            y:y+155,
            w:cardW-20,
            h:55
        };

        if(inside(p,buyBox)){
            buyShopItem(i);
            return;
        }
    }

    const close={
        x:W/2-85,
        y:H-90,
        w:170,
        h:55
    };

    if(inside(p,close)){
        shopOpen=false;
    }
}


// =====================================================
// BUY SHOP ITEM
// =====================================================

function buyShopItem(index){

    const item=shopItems[index];

    if(!item)return;

    if(score<item.price){

        message="❌ NOT ENOUGH COINS!";
        messageTimer=55;
        return;
    }


    /*
     * Health/lives are separate.
     * Buying a life NEVER adds HP.
     */
    score-=item.price;


    if(item.id==="life"){

        lives++;

        message="❤️ +1 LIFE!";
    }

    else if(item.id==="heal"){

        if(player.hp>=player.maxHP){

            score+=item.price;

            message="❤️ YOUR HP IS ALREADY FULL!";
            messageTimer=55;

            return;
        }

        player.hp=
            Math.min(
                player.maxHP,
                player.hp+10
            );

        message="💚 +10 HP!";
    }

    else if(item.id==="jump"){

        player.jumpPower-=1.5;

        purchasedPermanent.add(item.id);

        message="🦘 JUMP BOOST!";
    }

    else if(item.id==="speed"){

        player.speed+=1;

        purchasedPermanent.add(item.id);

        message="💨 SPEED BOOST!";
    }

    else if(item.id==="strength"){

        swordDamage+=2;

        purchasedPermanent.add(item.id);

        message="💪 STRENGTH UP!";
    }

    else if(item.id==="maxhp"){

        player.maxHP+=10;
        player.hp+=10;

        purchasedPermanent.add(item.id);

        message="❤️ MAX HP +10!";
    }

    else if(item.damage){

        /*
         * Only equip the weapon if it is stronger.
         */
        if(item.damage>swordDamage){

            swordDamage=item.damage;
            swordRarity=item.rarity;

            message=
                "⚔ "+item.name+"!";
        }else{

            message=
                "⚔ "+item.name+
                " purchased!";
        }

        purchasedPermanent.add(item.id);
    }

    messageTimer=70;

    shopItems.splice(index,1);
}


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

    return(
        a.x<b.x+b.width &&
        a.x+a.width>b.x &&
        a.y<b.y+b.height &&
        a.y+a.height>b.y
    );
}


// =====================================================
// ENTITY PHYSICS
// =====================================================

function moveEntity(e,platforms){

    e.vy+=.65;

    if(e.vy>17)e.vy=17;

    const oldY=e.y;

    e.x+=e.vx;
    e.y+=e.vy;

    e.ground=false;

    for(const p of platforms){

        const plat={
            x:p[0],
            y:p[1],
            width:p[2],
            height:p[3]
        };

        if(!collision(e,plat))
            continue;

        const oldBottom=oldY+e.height;
        const newBottom=e.y+e.height;

        if(
            e.vy>=0 &&
            oldBottom<=plat.y+12 &&
            newBottom>=plat.y
        ){

            e.y=plat.y-e.height;
            e.vy=0;
            e.ground=true;
        }

        else if(e.vy<0){

            e.y=plat.y+plat.height;
            e.vy=0;
        }
    }
}


// =====================================================
// PLATFORM BELOW
// =====================================================

function platformBelow(e,platforms){

    let result=null;
    let closest=Infinity;

    for(const p of platforms){

        const overlap=
            e.x+e.width>p[0] &&
            e.x<p[0]+p[2];

        if(!overlap)continue;

        const d=
            p[1]-
            (e.y+e.height);

        if(d>=-10&&d<closest){

            closest=d;
            result=p;
        }
    }

    return result;
}


// =====================================================
// DAMAGE PLAYER
// =====================================================

function damagePlayer(amount){

    if(gameOver||gameWon)return;

    player.hp-=amount;

    if(player.hp<=0){

        lives--;

        if(lives<=0){

            gameOver=true;
            return;
        }

        /*
         * Respawn at beginning of CURRENT LEVEL.
         * HP is completely restored.
         */
        player.x=80;
        player.y=250;
        player.vx=0;
        player.vy=0;
        player.hp=player.maxHP;

        camera=0;

        message="💥 RESPAWN!";
        messageTimer=80;
    }
}


// =====================================================
// ATTACK
// =====================================================

function attack(){

    if(gameOver||gameWon)return;

    /*
     * Attack every 0.5 seconds.
     */
    if(player.attackCooldown>0)return;

    player.attackCooldown=.5;

    player.attacking=true;
    player.attackTimer=.22;

    const facing=
        player.vx<0?-1:1;

    for(const enemy of enemies){

        if(enemy.dead)continue;

        const dx=enemy.x-player.x;
        const dy=Math.abs(enemy.y-player.y);

        const inFront=
            dx*facing>=-25 &&
            dx*facing<=115;

        if(inFront&&dy<130){

            enemy.hp-=swordDamage;

            if(enemy.hp<=0){

                enemy.dead=true;
                monstersKilled++;
                score++;

                message="+1 MONSTER!";
                messageTimer=25;
            }
        }
    }
}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemy(e,L,dt){

    if(e.dead)return;


    // =================================================
    // BOSS
    // =================================================

    if(e.boss){

        if(
            Math.abs(player.x-e.x)<750
        ){
            e.active=true;
        }

        if(!e.active)return;

        e.attackTimer+=dt;

        if(
            e.attackTimer>=e.rate &&
            !e.warning
        ){

            e.attackTimer=0;
            e.warning=true;
            e.warningTimer=.5;
        }

        if(e.warning){

            e.warningTimer-=dt;

            if(e.warningTimer<=0){

                e.warning=false;

                const center=
                    e.x+e.width/2;

                const pc=
                    player.x+player.width/2;

                if(
                    Math.abs(pc-center)<
                    e.width/2+120
                ){
                    damagePlayer(e.damage);
                }
            }
        }

        return;
    }


    // =================================================
    // NORMAL MONSTERS
    // =================================================

    const dx=player.x-e.x;
    const distance=Math.abs(dx);

    if(!e.active&&distance<550)
        e.active=true;

    if(!e.active)return;


    /*
     * If a monster falls into the void,
     * it is permanently removed.
     *
     * This prevents a fallen monster from
     * attacking the player from below.
     */
    if(e.y>H+700){

        e.dead=true;
        return;
    }


    if(distance>900){

        e.active=false;
        e.vx=0;

        return;
    }


    const dir=dx>0?1:-1;

    e.vx=dir*e.speed;


    const monsterPlatform=
        platformBelow(e,L.platforms);

    const playerPlatform=
        platformBelow(player,L.platforms);


    /*
     * Jump to higher platforms.
     */
    if(
        e.ground &&
        monsterPlatform &&
        playerPlatform &&
        playerPlatform[1]<
        monsterPlatform[1]-25
    ){
        e.vy=-12;
    }


    moveEntity(e,L.platforms);


    /*
     * Attack only when physically close.
     */
    if(collision(player,e)){

        e.attackTimer+=dt;

        if(e.attackTimer>=e.rate){

            e.attackTimer=0;
            damagePlayer(e.damage);
        }

    }else{

        e.attackTimer=0;
    }
}


// =====================================================
// UPDATE
// =====================================================

function update(){

    const now=performance.now();

    let dt=(now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.05);

    if(gameOver||gameWon)return;
    if(shopOpen)return;

    const L=levels[level];


    // =================================================
    // SHOP DISTANCE
    // =================================================

    nearShop=false;

    if(shop){

        const dx=Math.abs(player.x-shop.x);
        const dy=Math.abs(player.y-shop.y);

        nearShop=dx<170&&dy<150;
    }


    // =================================================
    // CONTROLS
    // =================================================

    const left=keyLeft||touchLeft;
    const right=keyRight||touchRight;
    const jump=keyJump||touchJump;
    const attacking=keyAttack||touchAttack;


    // =================================================
    // MOVEMENT
    // =================================================

    if(left)player.vx-=.8;
    if(right)player.vx+=.8;

    if(!left&&!right)
        player.vx*=.82;

    player.vx=Math.max(
        -player.speed,
        Math.min(player.speed,player.vx)
    );


    // =================================================
    // JUMP
    // =================================================

    if(jump&&player.ground){

        player.vy=player.jumpPower;
        player.ground=false;
    }


    // =================================================
    // ATTACK
    // =================================================

    if(attacking)
        attack();

    if(player.attackCooldown>0){

        player.attackCooldown-=dt;

        if(player.attackCooldown<0)
            player.attackCooldown=0;
    }

    if(player.attacking){

        player.attackTimer-=dt;

        if(player.attackTimer<=0)
            player.attacking=false;
    }


    // =================================================
    // PLAYER PHYSICS
    // =================================================

    moveEntity(player,L.platforms);

    player.x=Math.max(0,player.x);


    // =================================================
    // COINS
    // =================================================

    for(const c of coins){

        if(c.collected)continue;

        const d=Math.hypot(
            player.x+player.width/2-c.x,
            player.y+player.height/2-c.y
        );

        if(d<35){

            c.collected=true;

            score++;
            totalCoins++;

            message="+1 COIN!";
            messageTimer=30;
        }
    }


    // =================================================
    // ENEMIES
    // =================================================

    for(const e of enemies)
        updateEnemy(e,L,dt);

    enemies=enemies.filter(e=>!e.dead);


    // =================================================
    // PORTAL
    // =================================================

    const bossAlive=
        enemies.some(e=>e.boss);

    if(
        collision(player,portal)&&
        !bossAlive
    ){

        if(level<19){

            loadLevel(level+1);

        }else{

            gameWon=true;
        }
    }


    // =================================================
    // FALL
    // =================================================

    if(player.y>H+500)
        damagePlayer(player.maxHP);


    // =================================================
    // CAMERA
    // =================================================

    const final=
        L.platforms[L.platforms.length-1];

    const worldWidth=
        final[0]+final[2]+150;

    camera+=(
        player.x-W*.35-camera
    )*.1;

    camera=Math.max(
        0,
        Math.min(
            Math.max(0,worldWidth-W),
            camera
        )
    );

    if(messageTimer>0)
        messageTimer--;
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    const L=levels[level];


    // SKY

    const gradient=
        ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,L.sky1);
    gradient.addColorStop(1,L.sky2);

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(-camera,0);


    // BACKGROUND

    ctx.fillStyle="rgba(255,255,255,.13)";

    for(let i=-2;i<20;i++){

        ctx.beginPath();

        ctx.moveTo(i*600,700);
        ctx.lineTo(i*600+300,180);
        ctx.lineTo(i*600+650,700);

        ctx.fill();
    }


    // PLATFORMS

    for(const p of L.platforms){

        ctx.fillStyle="#263244";

        ctx.fillRect(
            p[0],p[1],p[2],p[3]
        );

        ctx.fillStyle=
            level>=15?"#fb923c":"#22c55e";

        ctx.fillRect(
            p[0],p[1],p[2],7
        );
    }


    // SHOP

    if(shop){

        ctx.fillStyle="#78350f";

        ctx.fillRect(
            shop.x,
            shop.y,
            shop.width,
            shop.height
        );

        ctx.fillStyle="#fbbf24";

        ctx.fillRect(
            shop.x-8,
            shop.y-18,
            shop.width+16,
            22
        );

        ctx.fillStyle="white";
        ctx.font="bold 18px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "SHOP",
            shop.x+shop.width/2,
            shop.y+45
        );

        ctx.textAlign="left";
    }


    // COINS

    for(const c of coins){

        if(c.collected)continue;

        ctx.fillStyle="#facc15";

        ctx.beginPath();

        ctx.arc(c.x,c.y,11,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(c.x-3,c.y-3,3,0,Math.PI*2);
        ctx.fill();
    }


    // MONSTERS

    for(const e of enemies){

        if(e.boss){
            drawBoss(e);
            continue;
        }

        ctx.fillStyle=e.color;

        ctx.fillRect(
            e.x,e.y,e.width,e.height
        );

        ctx.fillStyle="#111827";

        ctx.fillRect(
            e.x+e.width*.2,
            e.y+e.height*.2,
            7,7
        );

        ctx.fillRect(
            e.x+e.width*.6,
            e.y+e.height*.2,
            7,7
        );

        drawHealth(
            e.x,
            e.y-14,
            e.width,
            7,
            e.hp,
            e.maxHP
        );
    }


    // PORTAL

    const bossAlive=
        enemies.some(e=>e.boss);

    ctx.fillStyle="white";

    ctx.fillRect(
        portal.x,
        portal.y,
        7,
        portal.height
    );

    ctx.fillStyle=
        bossAlive?"#64748b":"#a855f7";

    ctx.beginPath();

    ctx.moveTo(
        portal.x+7,
        portal.y
    );

    ctx.lineTo(
        portal.x+65,
        portal.y+20
    );

    ctx.lineTo(
        portal.x+7,
        portal.y+40
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="bold 13px Arial";

    ctx.fillText(
        bossAlive?"DEFEAT BOSS":"NEXT LEVEL",
        portal.x-20,
        portal.y-12
    );


    // PLAYER

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle="white";

    ctx.fillRect(
        player.x+6,
        player.y+10,
        7,7
    );

    ctx.fillRect(
        player.x+20,
        player.y+10,
        7,7
    );


    // =================================================
    // SWORD SLASH
    // =================================================

    if(player.attacking){

        ctx.save();

        const facing=
            player.vx<0?-1:1;

        ctx.translate(
            player.x+player.width/2,
            player.y+player.height/2
        );

        const progress=
            1-player.attackTimer/.22;

        ctx.rotate(
            facing*
            (-1.1+progress*2.2)
        );


        /*
         * Eternal Sword:
         * black outside + red middle.
         */
        if(swordRarity==="???"){

            ctx.fillStyle="#050505";

            ctx.fillRect(
                facing*5,
                -9,
                facing*75,
                18
            );

            ctx.fillStyle="#ef0000";

            ctx.fillRect(
                facing*5,
                -4,
                facing*75,
                8
            );

        }else{

            ctx.fillStyle=swordColor();

            ctx.fillRect(
                facing*5,
                -5,
                facing*65,
                10
            );
        }


        ctx.fillStyle="#78350f";

        ctx.fillRect(
            facing*-10,
            -4,
            20,
            8
        );

        ctx.restore();
    }


    // BOSS WARNING

    for(const e of enemies){

        if(e.boss&&e.warning){

            ctx.fillStyle="rgba(255,0,0,.3)";

            ctx.fillRect(
                e.x-120,
                e.y+e.height-18,
                e.width+240,
                35
            );

            ctx.fillStyle="white";
            ctx.font="bold 20px Arial";

            ctx.fillText(
                "⚠ INCOMING ATTACK!",
                e.x-70,
                e.y-25
            );
        }
    }

    ctx.restore();


    drawHUD();
    drawControls();


    // SHOP OPEN BUTTON

    if(nearShop&&!shopOpen){

        const b=getShopOpenButton();

        ctx.fillStyle="rgba(0,0,0,.75)";

        ctx.fillRect(
            b.x,b.y,b.w,b.h
        );

        ctx.strokeStyle="#fbbf24";
        ctx.lineWidth=3;

        ctx.strokeRect(
            b.x,b.y,b.w,b.h
        );

        ctx.fillStyle="white";
        ctx.textAlign="center";
        ctx.font="bold 20px Arial";

        ctx.fillText(
            "🏪 TAP TO SHOP",
            W/2,
            b.y+39
        );

        ctx.textAlign="left";
    }


    // MESSAGE

    if(messageTimer>0){

        ctx.fillStyle="rgba(0,0,0,.65)";

        ctx.fillRect(
            W/2-155,
            125,
            310,
            55
        );

        ctx.fillStyle="white";
        ctx.textAlign="center";
        ctx.font="bold 20px Arial";

        ctx.fillText(
            message,
            W/2,
            160
        );

        ctx.textAlign="left";
    }


    if(shopOpen)
        drawShop();

    if(gameOver||gameWon)
        drawEndScreen();
}


// =====================================================
// BOSS DRAW
// =====================================================

function drawBoss(b){

    ctx.fillStyle=
        b.maxHP===50?"#dc2626":"#b45309";

    ctx.fillRect(
        b.x,b.y,b.width,b.height
    );

    ctx.fillStyle="white";

    ctx.fillRect(
        b.x+b.width*.2,
        b.y+b.height*.2,
        20,20
    );

    ctx.fillRect(
        b.x+b.width*.65,
        b.y+b.height*.2,
        20,20
    );

    drawHealth(
        b.x,
        b.y-20,
        b.width,
        10,
        b.hp,
        b.maxHP
    );
}


// =====================================================
// HEALTH BAR
// =====================================================

function drawHealth(x,y,w,h,hp,max){

    ctx.fillStyle="#111827";

    ctx.fillRect(x,y,w,h);

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        x,
        y,
        w*Math.max(0,hp/max),
        h
    );
}


// =====================================================
// HUD
// =====================================================

function drawHUD(){

    const width=Math.min(450,W-20);

    ctx.fillStyle="rgba(0,0,0,.6)";

    ctx.fillRect(
        10,10,width,125
    );

    ctx.fillStyle="white";
    ctx.font="bold 17px Arial";

    ctx.fillText(
        "LEVEL "+(level+1)+
        " / 20 — "+
        levels[level].name,
        22,35
    );

    ctx.font="14px Arial";

    ctx.fillText(
        "❤️ HP: "+
        player.hp+" / "+player.maxHP,
        22,60
    );

    ctx.fillText(
        "💗 Lives: "+lives,
        22,83
    );

    ctx.fillText(
        "🪙 Coins: "+score,
        135,83
    );

    ctx.fillText(
        "☠ Kills: "+monstersKilled,
        250,83
    );

    ctx.fillStyle=swordColor();

    ctx.fillText(
        "⚔ "+swordRarity+
        " — "+swordDamage+" DMG",
        22,108
    );

    ctx.fillStyle="white";
}


// =====================================================
// CONTROLS
// =====================================================

function drawControls(){

    const b=getButtons();

    drawControl(b.left,touchLeft);
    drawControl(b.right,touchRight);
    drawControl(b.jump,touchJump);
    drawControl(b.attack,touchAttack);

    ctx.textAlign="center";
    ctx.fillStyle="white";
    ctx.font="bold 35px Arial";

    ctx.fillText(
        "◀",
        b.left.x+b.left.w/2,
        b.left.y+48
    );

    ctx.fillText(
        "▶",
        b.right.x+b.right.w/2,
        b.right.y+48
    );

    ctx.fillText(
        "▲",
        b.jump.x+b.jump.w/2,
        b.jump.y+48
    );

    ctx.font="bold 27px Arial";

    ctx.fillText(
        "⚔",
        b.attack.x+b.attack.w/2,
        b.attack.y+48
    );

    ctx.textAlign="left";
}

function drawControl(b,active){

    ctx.fillStyle=
        active
        ?"rgba(255,255,255,.45)"
        :"rgba(255,255,255,.18)";

    ctx.strokeStyle="rgba(255,255,255,.75)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.roundRect(
        b.x,b.y,b.w,b.h,20
    );

    ctx.fill();
    ctx.stroke();
}


// =====================================================
// SHOP DRAW
// =====================================================

function drawShop(){

    ctx.fillStyle="rgba(0,0,0,.88)";

    ctx.fillRect(
        0,0,W,H
    );

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 32px Arial";

    ctx.fillText(
        "🏪 SHOP",
        W/2,55
    );

    ctx.font="17px Arial";

    ctx.fillText(
        "🪙 Coins: "+score,
        W/2,85
    );


    const cardW=Math.min(200,(W-50)/3);
    const gap=10;
    const total=cardW*3+gap*2;
    const start=W/2-total/2;


    for(let i=0;i<shopItems.length;i++){

        const item=shopItems[i];

        const x=start+i*(cardW+gap);
        const y=125;


        ctx.fillStyle="rgba(255,255,255,.12)";

        ctx.fillRect(
            x,y,cardW,245
        );


        ctx.strokeStyle=
            item.damage
            ?rarityColor(item.rarity)
            :"rgba(255,255,255,.35)";

        ctx.lineWidth=3;

        ctx.strokeRect(
            x,y,cardW,245
        );


        ctx.fillStyle="white";
        ctx.font="bold 16px Arial";

        ctx.fillText(
            item.name,
            x+cardW/2,
            y+40
        );


        ctx.font="13px Arial";

        ctx.fillText(
            item.description||"",
            x+cardW/2,
            y+75
        );


        if(item.damage){

            /*
             * Display Eternal as ??? rarity.
             */
            ctx.fillStyle=
                rarityColor(item.rarity);

            ctx.font="bold 18px Arial";

            ctx.fillText(
                item.rarity+
                " • "+
                item.damage+
                " DMG",
                x+cardW/2,
                y+112
            );
        }


        ctx.fillStyle="white";
        ctx.font="bold 18px Arial";

        ctx.fillText(
            "🪙 "+item.price,
            x+cardW/2,
            y+145
        );


        const affordable=
            score>=item.price;

        ctx.fillStyle=
            affordable
            ?"rgba(34,197,94,.85)"
            :"rgba(90,90,90,.7)";

        ctx.fillRect(
            x+10,
            y+170,
            cardW-20,
            55
        );

        ctx.fillStyle="white";
        ctx.font="bold 16px Arial";

        ctx.fillText(
            affordable?"BUY":"CAN'T AFFORD",
            x+cardW/2,
            y+205
        );
    }


    ctx.fillStyle="rgba(239,68,68,.85)";

    ctx.fillRect(
        W/2-85,
        H-90,
        170,
        55
    );

    ctx.fillStyle="white";
    ctx.font="bold 18px Arial";

    ctx.fillText(
        "CLOSE",
        W/2,
        H-55
    );

    ctx.textAlign="left";
}


// =====================================================
// END SCREEN
// =====================================================

function drawEndScreen(){

    ctx.fillStyle="rgba(0,0,0,.87)";

    ctx.fillRect(
        0,0,W,H
    );

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 30px Arial";

    ctx.fillText(
        gameWon
        ?"🏆 YOU BEAT ALL 20 LEVELS!"
        :"💀 GAME OVER",
        W/2,
        H/2-115
    );

    ctx.font="19px Arial";

    ctx.fillText(
        "Level reached: "+(level+1),
        W/2,H/2-65
    );

    ctx.fillText(
        "🪙 Total coins: "+totalCoins,
        W/2,H/2-30
    );

    ctx.fillText(
        "☠ Monsters defeated: "+monstersKilled,
        W/2,H/2+5
    );

    ctx.fillText(
        "⚔ Sword: "+
        swordRarity+
        " ("+swordDamage+" damage)",
        W/2,H/2+40
    );

    ctx.fillText(
        "Press R to play again",
        W/2,H/2+90
    );

    ctx.textAlign="left";
}


// =====================================================
// RESTART
// =====================================================

function restart(){

    level=0;

    score=0;
    totalCoins=0;
    monstersKilled=0;

    lives=3;

    swordDamage=3;
    swordRarity="COMMON";

    purchasedPermanent.clear();

    camera=0;

    gameOver=false;
    gameWon=false;
    shopOpen=false;

    loadLevel(0);
}


// =====================================================
// START
// =====================================================

loadLevel(0);


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
