<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Sky Bound Runner</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

canvas{
    position:fixed;
    left:0;
    top:0;
    width:100vw;
    height:100vh;
    display:block;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=1;

function resize(){
    W=innerWidth;
    H=innerHeight;

    dpr=Math.min(devicePixelRatio||1,2);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
addEventListener("orientationchange",resize);
resize();


// =====================================================
// INPUT
// =====================================================

let touchLeft=false;
let touchRight=false;
let touchJump=false;
let touchAttack=false;

let keyLeft=false;
let keyRight=false;
let keyJump=false;
let keyAttack=false;

const fingers=new Map();

function buttons(){

    const s=Math.min(
        100,
        Math.max(82,W*.14)
    );

    const gap=14;
    const bottom=22;

    return{
        left:{
            x:20,
            y:H-s-bottom,
            w:s,
            h:s
        },

        right:{
            x:20+s+gap,
            y:H-s-bottom,
            w:s,
            h:s
        },

        jump:{
            x:W-s*2-gap-20,
            y:H-s-bottom,
            w:s,
            h:s
        },

        attack:{
            x:W-s-20,
            y:H-s-bottom,
            w:s,
            h:s
        }
    };
}

function point(e){

    const r=canvas.getBoundingClientRect();

    return{
        x:e.clientX-r.left,
        y:e.clientY-r.top
    };
}

function inside(p,b){

    return(
        p.x>=b.x &&
        p.x<=b.x+b.w &&
        p.y>=b.y &&
        p.y<=b.y+b.h
    );
}

function updateTouches(){

    touchLeft=false;
    touchRight=false;
    touchJump=false;
    touchAttack=false;

    const b=buttons();

    for(const p of fingers.values()){

        if(inside(p,b.left))
            touchLeft=true;

        if(inside(p,b.right))
            touchRight=true;

        if(inside(p,b.jump))
            touchJump=true;

        if(inside(p,b.attack))
            touchAttack=true;
    }
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();

    fingers.set(
        e.pointerId,
        point(e)
    );

    try{
        canvas.setPointerCapture(e.pointerId);
    }catch(_){}

    updateTouches();
},{passive:false});

canvas.addEventListener("pointermove",e=>{
    e.preventDefault();

    if(fingers.has(e.pointerId)){
        fingers.set(
            e.pointerId,
            point(e)
        );

        updateTouches();
    }
},{passive:false});

function pointerEnd(e){
    fingers.delete(e.pointerId);
    updateTouches();
}

canvas.addEventListener("pointerup",pointerEnd);
canvas.addEventListener("pointercancel",pointerEnd);


// Keyboard

document.addEventListener("keydown",e=>{

    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")
        keyLeft=true;

    if(k==="arrowright"||k==="d")
        keyRight=true;

    if(k==="arrowup"||k==="w"||k===" "){
        keyJump=true;
        e.preventDefault();
    }

    if(k==="j"||k==="f"||k==="z"){
        keyAttack=true;
        e.preventDefault();
    }

    if(k==="r")
        restart();
});

document.addEventListener("keyup",e=>{

    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")
        keyLeft=false;

    if(k==="arrowright"||k==="d")
        keyRight=false;

    if(k==="arrowup"||k==="w"||k===" ")
        keyJump=false;

    if(k==="j"||k==="f"||k==="z")
        keyAttack=false;
});


// =====================================================
// LEVELS
// =====================================================

const levels=[];

const themes=[
    ["#60a5fa","#dbeafe","MEADOW"],
    ["#172033","#475569","CAVERNS"],
    ["#a78bfa","#f5d0fe","SKYLANDS"],
    ["#450a0a","#f97316","VOLCANO"]
];

for(let n=0;n<20;n++){

    const platforms=[];

    let x=0;

    /*
       IMPORTANT:
       Platforms are deliberately kept within
       jumpable distances.

       Horizontal gap: 55-100 px
       Vertical difference: never more than 75 px
    */

    for(let i=0;i<14;i++){

        let y;

        if(i===0){
            y=500;
        }else{

            const previous=
                platforms[i-1][1];

            const change=
                ((i*31+n*17)%151)-75;

            y=previous+change;

            y=Math.max(330,Math.min(520,y));
        }

        const width=
            300+
            ((i*47+n*13)%100);

        platforms.push([
            x,
            y,
            width,
            45
        ]);

        x+=
            width+
            60+
            ((i*17+n*11)%41);
    }

    // Final safe platform

    platforms.push([
        x,
        450,
        700,
        50
    ]);

    const coins=[];

    for(const p of platforms){

        coins.push([
            p[0]+p[2]/2,
            p[1]-35
        ]);
    }

    const monsters=[];

    for(let m=0;m<6;m++){

        const pi=
            Math.min(
                m+1,
                platforms.length-2
            );

        const p=platforms[pi];

        let type=1;

        if(n>=5 && m>=2)
            type=2;

        if(n>=10 && m>=3)
            type=3;

        if(n>=15 && m>=4)
            type=4;

        monsters.push({
            x:p[0]+p[2]/2,
            type:type
        });
    }

    levels.push({
        name:themes[Math.floor(n/5)][2],
        sky1:themes[Math.floor(n/5)][0],
        sky2:themes[Math.floor(n/5)][1],
        platforms:platforms,
        coins:coins,
        monsters:monsters,
        boss:n===9||n===19
    });
}


// =====================================================
// GAME VARIABLES
// =====================================================

let level=0;
let score=0;
let totalCoins=0;
let monstersKilled=0;

let lives=3;

let camera=0;

let gameOver=false;
let gameWon=false;

let message="";
let messageTimer=0;

let player;
let coins=[];
let enemies=[];
let portal;

let lastTime=performance.now();


// =====================================================
// MONSTER TYPES
// =====================================================

function monsterStats(type){

    if(type===1){
        return{
            hp:5,
            damage:5,
            rate:.75,
            width:34,
            height:48,
            color:"#ef4444",
            speed:2.4
        };
    }

    if(type===2){
        return{
            hp:10,
            damage:7,
            rate:1,
            width:42,
            height:60,
            color:"#22c55e",
            speed:2.2
        };
    }

    if(type===3){
        return{
            hp:15,
            damage:10,
            rate:1.5,
            width:51,
            height:72,
            color:"#a855f7",
            speed:2
        };
    }

    return{
        hp:20,
        damage:15,
        rate:2,
        width:68,
        height:96,
        color:"#facc15",
        speed:1.7
    };
}


// =====================================================
// LOAD LEVEL
// =====================================================

function loadLevel(n){

    level=n;

    const L=levels[level];

    const maxHP=
        20+
        level*10;

    player={
        x:80,
        y:250,

        width:34,
        height:48,

        vx:0,
        vy:0,

        speed:7,
        jumpPower:-13,

        ground:false,

        maxHP:maxHP,
        hp:maxHP,

        attackCooldown:0,
        attacking:false,
        attackTimer:0
    };

    coins=L.coins.map(c=>({
        x:c[0],
        y:c[1],
        collected:false
    }));

    enemies=[];

    for(const data of L.monsters){

        const s=
            monsterStats(data.type);

        enemies.push({
            x:data.x,
            y:0,

            width:s.width,
            height:s.height,

            type:data.type,

            hp:s.hp,
            maxHP:s.hp,

            damage:s.damage,
            rate:s.rate,
            speed:s.speed,

            color:s.color,

            vx:0,
            vy:0,

            ground:false,
            active:false,

            attackTimer:0,

            dead:false,
            boss:false
        });
    }

    // Boss

    if(L.boss){

        const final=
            L.platforms[
                L.platforms.length-1
            ];

        const secondBoss=
            level===19;

        const bw=
            secondBoss?204:170;

        const bh=
            secondBoss?288:240;

        enemies.push({

            x:
                final[0]+
                final[2]-bw-80,

            y:
                final[1]-bh,

            width:bw,
            height:bh,

            hp:
                secondBoss?50:35,

            maxHP:
                secondBoss?50:35,

            damage:
                secondBoss?30:20,

            rate:
                secondBoss?3.5:3,

            boss:true,

            active:false,

            attackTimer:0,

            warning:false,

            warningTimer:0,

            vx:0,
            vy:0,

            ground:true,

            dead:false
        });
    }

    const final=
        L.platforms[
            L.platforms.length-1
        ];

    // PORTAL IS ALWAYS AT THE END

    portal={
        x:
            final[0]+
            final[2]-90,

        y:
            final[1]-75,

        width:50,
        height:75
    };

    camera=0;

    message=
        L.boss
        ?"⚠ BOSS FIGHT!"
        :L.name+
         " — LEVEL "+
         (level+1);

    messageTimer=100;
}


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

    return(
        a.x<b.x+b.width &&
        a.x+a.width>b.x &&
        a.y<b.y+b.height &&
        a.y+a.height>b.y
    );
}


// =====================================================
// PHYSICS
// =====================================================

function moveEntity(e,platforms){

    e.vy+=.65;

    if(e.vy>17)
        e.vy=17;

    const oldY=e.y;

    e.x+=e.vx;
    e.y+=e.vy;

    e.ground=false;

    for(const p of platforms){

        const plat={
            x:p[0],
            y:p[1],
            width:p[2],
            height:p[3]
        };

        if(!collision(e,plat))
            continue;

        const oldBottom=
            oldY+e.height;

        const newBottom=
            e.y+e.height;

        // Landing

        if(
            e.vy>=0 &&
            oldBottom<=plat.y+12 &&
            newBottom>=plat.y
        ){

            e.y=
                plat.y-
                e.height;

            e.vy=0;

            e.ground=true;
        }

        // Ceiling

        else if(e.vy<0){

            e.y=
                plat.y+
                plat.height;

            e.vy=0;
        }
    }
}


// =====================================================
// FIND PLATFORM
// =====================================================

function platformBelow(e,platforms){

    let result=null;
    let closest=Infinity;

    for(const p of platforms){

        const overlap=
            e.x+e.width>p[0] &&
            e.x<p[0]+p[2];

        if(!overlap)
            continue;

        const d=
            p[1]-
            (e.y+e.height);

        if(
            d>=-10 &&
            d<closest
        ){

            closest=d;
            result=p;
        }
    }

    return result;
}


// =====================================================
// DAMAGE
// =====================================================

function damagePlayer(amount){

    if(gameOver||gameWon)
        return;

    player.hp-=amount;

    if(player.hp<=0){

        lives--;

        if(lives<=0){

            gameOver=true;
            return;
        }

        // Respawn at beginning of CURRENT LEVEL

        player.x=80;
        player.y=250;

        player.vx=0;
        player.vy=0;

        // Respawn with full HP

        player.hp=
            player.maxHP;

        camera=0;

        message="RESPAWN!";
        messageTimer=80;
    }
}


// =====================================================
// SWORD ATTACK
// =====================================================

function attack(){

    if(gameOver||gameWon)
        return;

    // ================================================
    // ATTACK SPEED
    // 0.5 SECOND COOLDOWN
    // ================================================

    if(player.attackCooldown>0)
        return;

    player.attackCooldown=.5;

    player.attacking=true;
    player.attackTimer=.2;

    const damage=3;

    const facing=
        player.vx<0?-1:1;

    for(const enemy of enemies){

        if(enemy.dead)
            continue;

        // NEVER allow stomping to hurt bosses.
        // Sword attacks are the only way.

        const dx=
            enemy.x-player.x;

        const dy=
            Math.abs(enemy.y-player.y);

        const inFront=
            dx*facing>=-25 &&
            dx*facing<=105;

        if(
            inFront &&
            dy<125
        ){

            enemy.hp-=damage;

            if(enemy.hp<=0){

                enemy.dead=true;

                monstersKilled++;
                score++;

                message="+1 MONSTER!";
                messageTimer=25;
            }
        }
    }
}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemy(e,L,dt){

    if(e.dead)
        return;

    // =================================================
    // BOSS
    // =================================================

    if(e.boss){

        if(
            Math.abs(
                player.x-e.x
            )<700
        )
            e.active=true;

        if(!e.active)
            return;

        e.attackTimer+=dt;

        if(
            e.attackTimer>=e.rate
        ){

            e.attackTimer=0;

            e.warning=true;
            e.warningTimer=.5;
        }

        if(e.warning){

            e.warningTimer-=dt;

            if(
                e.warningTimer<=0
            ){

                e.warning=false;

                const center=
                    e.x+
                    e.width/2;

                const pc=
                    player.x+
                    player.width/2;

                // Boss only hits directly in front.

                if(
                    Math.abs(
                        pc-center
                    )<
                    e.width/2+110
                ){

                    damagePlayer(
                        e.damage
                    );
                }
            }
        }

        return;
    }


    // =================================================
    // NORMAL MONSTER
    // =================================================

    const dx=
        player.x-e.x;

    const distance=
        Math.abs(dx);


    if(
        !e.active &&
        distance<550
    )
        e.active=true;


    if(!e.active)
        return;


    // IMPORTANT:
    // Monsters that fall into the void are removed
    // and cannot attack from off-screen.

    if(
        e.y>H+700
    ){

        e.dead=true;
        return;
    }


    if(distance>850){

        e.active=false;
        e.vx=0;

        return;
    }


    const dir=
        dx>0?1:-1;

    e.vx=
        dir*e.speed;


    const monsterPlatform=
        platformBelow(
            e,
            L.platforms
        );

    const playerPlatform=
        platformBelow(
            player,
            L.platforms
        );


    // Jump UP to player platform

    if(
        e.ground &&
        monsterPlatform &&
        playerPlatform &&
        playerPlatform[1]<
        monsterPlatform[1]-25
    ){

        e.vy=-12;
    }


    moveEntity(
        e,
        L.platforms
    );


    // Attack only when actually close

    if(
        collision(
            player,
            e
        )
    ){

        e.attackTimer+=dt;

        if(
            e.attackTimer>=e.rate
        ){

            e.attackTimer=0;

            damagePlayer(
                e.damage
            );
        }

    }else{

        e.attackTimer=0;
    }
}


// =====================================================
// UPDATE
// =====================================================

function update(){

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.05);

    if(gameOver||gameWon)
        return;

    const L=
        levels[level];


    // INPUT

    const left=
        keyLeft||
        touchLeft;

    const right=
        keyRight||
        touchRight;

    const jump=
        keyJump||
        touchJump;

    const attacking=
        keyAttack||
        touchAttack;


    // MOVEMENT

    if(left)
        player.vx-=.8;

    if(right)
        player.vx+=.8;

    if(!left&&!right)
        player.vx*=.82;

    player.vx=
        Math.max(
            -player.speed,
            Math.min(
                player.speed,
                player.vx
            )
        );


    // JUMP

    if(
        jump &&
        player.ground
    ){

        player.vy=
            player.jumpPower;

        player.ground=false;
    }


    // ATTACK

    if(attacking)
        attack();


    if(player.attackCooldown>0)
        player.attackCooldown-=dt;


    if(player.attacking){

        player.attackTimer-=dt;

        if(player.attackTimer<=0)
            player.attacking=false;
    }


    // PLAYER PHYSICS

    moveEntity(
        player,
        L.platforms
    );


    player.x=
        Math.max(
            0,
            player.x
        );


    // COINS

    for(const c of coins){

        if(c.collected)
            continue;

        const d=
            Math.hypot(
                player.x+
                player.width/2-c.x,

                player.y+
                player.height/2-c.y
            );

        if(d<35){

            c.collected=true;

            score++;
            totalCoins++;

            message="+1 COIN!";
            messageTimer=30;
        }
    }


    // ENEMIES

    for(const e of enemies)
        updateEnemy(e,L,dt);


    enemies=
        enemies.filter(
            e=>!e.dead
        );


    // PORTAL

    const bossAlive=
        enemies.some(
            e=>e.boss
        );


    if(
        collision(player,portal) &&
        !bossAlive
    ){

        if(level<19){

            loadLevel(level+1);

        }else{

            gameWon=true;
        }
    }


    // FALL

    if(
        player.y>
        H+500
    ){

        damagePlayer(
            player.maxHP
        );
    }


    // CAMERA

    const final=
        L.platforms[
            L.platforms.length-1
        ];

    const worldWidth=
        final[0]+
        final[2]+
        120;


    camera+=
        (
            player.x-
            W*.35-
            camera
        )*.1;


    camera=
        Math.max(
            0,
            Math.min(
                Math.max(
                    0,
                    worldWidth-W
                ),
                camera
            )
        );


    if(messageTimer>0)
        messageTimer--;
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    const L=
        levels[level];


    // SKY

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        L.sky1
    );

    gradient.addColorStop(
        1,
        L.sky2
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,0,W,H
    );


    ctx.save();

    ctx.translate(
        -camera,
        0
    );


    // BACKGROUND

    ctx.fillStyle=
        "rgba(255,255,255,.13)";

    for(
        let i=-2;
        i<20;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i*600,
            700
        );

        ctx.lineTo(
            i*600+300,
            180
        );

        ctx.lineTo(
            i*600+650,
            700
        );

        ctx.fill();
    }


    // PLATFORMS

    for(const p of L.platforms){

        ctx.fillStyle="#263244";

        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            p[3]
        );

        ctx.fillStyle=
            level>=15
            ?" #fb923c"
            :" #22c55e";

        ctx.fillStyle=
            ctx.fillStyle.trim();

        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            7
        );
    }


    // COINS

    for(const c of coins){

        if(c.collected)
            continue;

        ctx.fillStyle="#facc15";

        ctx.beginPath();

        ctx.arc(
            c.x,
            c.y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(
            c.x-3,
            c.y-3,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    // ENEMIES

    for(const e of enemies){

        if(e.boss){

            drawBoss(e);

            continue;
        }

        ctx.fillStyle=e.color;

        ctx.fillRect(
            e.x,
            e.y,
            e.width,
            e.height
        );

        ctx.fillStyle="#111827";

        ctx.fillRect(
            e.x+e.width*.2,
            e.y+e.height*.2,
            7,
            7
        );

        ctx.fillRect(
            e.x+e.width*.6,
            e.y+e.height*.2,
            7,
            7
        );

        drawHealth(
            e.x,
            e.y-14,
            e.width,
            7,
            e.hp,
            e.maxHP
        );
    }


    // PORTAL / FLAG

    const bossAlive=
        enemies.some(
            e=>e.boss
        );


    if(!bossAlive){

        ctx.strokeStyle=
            "rgba(168,85,247,.45)";

        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.arc(
            portal.x+25,
            portal.y+40,
            42,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    // POLE

    ctx.fillStyle="white";

    ctx.fillRect(
        portal.x,
        portal.y,
        7,
        portal.height
    );


    // FLAG

    ctx.fillStyle=
        bossAlive
        ?" #64748b"
        :" #a855f7";

    ctx.fillStyle=
        ctx.fillStyle.trim();

    ctx.beginPath();

    ctx.moveTo(
        portal.x+7,
        portal.y
    );

    ctx.lineTo(
        portal.x+65,
        portal.y+20
    );

    ctx.lineTo(
        portal.x+7,
        portal.y+40
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="white";

    ctx.font="bold 13px Arial";

    ctx.fillText(
        bossAlive
        ?"DEFEAT BOSS"
        :"NEXT LEVEL",
        portal.x-20,
        portal.y-12
    );


    // PLAYER

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    ctx.fillStyle="white";

    ctx.fillRect(
        player.x+6,
        player.y+10,
        7,
        7
    );

    ctx.fillRect(
        player.x+20,
        player.y+10,
        7,
        7
    );


    // SWORD SLASH

    if(player.attacking){

        ctx.save();

        const facing=
            player.vx<0?-1:1;

        ctx.translate(
            player.x+
            player.width/2,

            player.y+
            player.height/2
        );

        ctx.rotate(
            facing*-.8
        );

        ctx.fillStyle="#d1d5db";

        ctx.fillRect(
            facing*5,
            -6,
            facing*60,
            10
        );

        ctx.fillStyle="#78350f";

        ctx.fillRect(
            facing*-8,
            -4,
            18,
            7
        );

        ctx.restore();
    }


    // BOSS WARNING

    for(const e of enemies){

        if(
            e.boss &&
            e.warning
        ){

            ctx.fillStyle=
                "rgba(255,0,0,.25)";

            ctx.fillRect(
                e.x-120,
                e.y+e.height-15,
                e.width+240,
                30
            );

            ctx.fillStyle="white";

            ctx.font=
                "bold 20px Arial";

            ctx.fillText(
                "⚠ INCOMING ATTACK!",
                e.x-70,
                e.y-25
            );
        }
    }


    ctx.restore();


    drawHUD();
    drawControls();


    // MESSAGE

    if(messageTimer>0){

        ctx.fillStyle=
            "rgba(0,0,0,.65)";

        ctx.fillRect(
            W/2-150,
            110,
            300,
            55
        );

        ctx.fillStyle="white";

        ctx.textAlign="center";

        ctx.font=
            "bold 20px Arial";

        ctx.fillText(
            message,
            W/2,
            145
        );

        ctx.textAlign="left";
    }


    // GAME OVER / WIN

    if(gameOver||gameWon){

        ctx.fillStyle=
            "rgba(0,0,0,.84)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.textAlign="center";

        ctx.fillStyle="white";

        ctx.font=
            "bold 30px Arial";

        ctx.fillText(
            gameWon
            ?"🏆 YOU BEAT ALL 20 LEVELS!"
            :"💀 GAME OVER",
            W/2,
            H/2-95
        );

        ctx.font="19px Arial";

        ctx.fillText(
            "Level: "+
            (level+1),
            W/2,
            H/2-50
        );

        ctx.fillText(
            "Coins collected: "+
            totalCoins,
            W/2,
            H/2-15
        );

        ctx.fillText(
            "Monsters defeated: "+
            monstersKilled,
            W/2,
            H/2+20
        );

        ctx.fillText(
            "Press R to play again",
            W/2,
            H/2+75
        );

        ctx.textAlign="left";
    }
}


// =====================================================
// BOSS
// =====================================================

function drawBoss(b){

    ctx.fillStyle=
        b.maxHP===50
        ?" #dc2626"
        :" #b45309";

    ctx.fillStyle=
        ctx.fillStyle.trim();

    ctx.fillRect(
        b.x,
        b.y,
        b.width,
        b.height
    );

    ctx.fillStyle="white";

    ctx.fillRect(
        b.x+b.width*.2,
        b.y+b.height*.2,
        20,
        20
    );

    ctx.fillRect(
        b.x+b.width*.65,
        b.y+b.height*.2,
        20,
        20
    );

    if(b.warning){

        ctx.fillStyle="#f87171";

        ctx.fillRect(
            b.x-80,
            b.y+70,
            80,
            35
        );

        ctx.fillRect(
            b.x+b.width,
            b.y+70,
            80,
            35
        );
    }

    drawHealth(
        b.x,
        b.y-20,
        b.width,
        10,
        b.hp,
        b.maxHP
    );
}


// =====================================================
// HEALTH BAR
// =====================================================

function drawHealth(
    x,y,w,h,hp,max
){

    ctx.fillStyle="#111827";

    ctx.fillRect(
        x,y,w,h
    );

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        x,
        y,
        w*Math.max(
            0,
            hp/max
        ),
        h
    );
}


// =====================================================
// HUD
// =====================================================

function drawHUD(){

    const width=
        Math.min(
            430,
            W-20
        );

    ctx.fillStyle=
        "rgba(0,0,0,.58)";

    ctx.fillRect(
        10,
        10,
        width,
        110
    );

    ctx.fillStyle="white";

    ctx.font=
        "bold 17px Arial";

    ctx.fillText(
        "LEVEL "+
        (level+1)+
        " / 20 — "+
        levels[level].name,
        22,
        35
    );

    ctx.font="14px Arial";

    ctx.fillText(
        "❤️ HP: "+
        player.hp+
        " / "+
        player.maxHP,
        22,
        61
    );

    ctx.fillText(
        "💗 Lives: "+
        lives,
        22,
        84
    );

    ctx.fillText(
        "🪙 Coins: "+
        score,
        135,
        84
    );

    ctx.fillText(
        "⚔ Kills: "+
        monstersKilled,
        250,
        84
    );
}


// =====================================================
// BUTTONS
// =====================================================

function drawControls(){

    const b=buttons();

    drawControl(
        b.left,
        touchLeft
    );

    drawControl(
        b.right,
        touchRight
    );

    drawControl(
        b.jump,
        touchJump
    );

    drawControl(
        b.attack,
        touchAttack
    );

    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.font=
        "bold 35px Arial";

    ctx.fillText(
        "◀",
        b.left.x+b.left.w/2,
        b.left.y+48
    );

    ctx.fillText(
        "▶",
        b.right.x+b.right.w/2,
        b.right.y+48
    );

    ctx.fillText(
        "▲",
        b.jump.x+b.jump.w/2,
        b.jump.y+48
    );

    ctx.font=
        "bold 27px Arial";

    ctx.fillText(
        "⚔",
        b.attack.x+b.attack.w/2,
        b.attack.y+48
    );

    ctx.textAlign="left";
}


function drawControl(b,active){

    ctx.fillStyle=
        active
        ?"rgba(255,255,255,.45)"
        :"rgba(255,255,255,.18)";

    ctx.strokeStyle=
        "rgba(255,255,255,.75)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.roundRect(
        b.x,
        b.y,
        b.w,
        b.h,
        20
    );

    ctx.fill();
    ctx.stroke();
}


// =====================================================
// RESTART
// =====================================================

function restart(){

    level=0;
    score=0;
    totalCoins=0;
    monstersKilled=0;
    lives=3;
    camera=0;

    gameOver=false;
    gameWon=false;

    loadLevel(0);
}


// =====================================================
// START
// =====================================================

loadLevel(0);


// =====================================================
// GAME LOOP
// =====================================================

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>
