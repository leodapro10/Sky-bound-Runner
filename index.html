<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    dpr=Math.min(devicePixelRatio||1,2);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
addEventListener("orientationchange",resize);

resize();


// =====================================================
// INPUT
// =====================================================

let touchLeft=false;
let touchRight=false;
let touchJump=false;
let touchAttack=false;

let keyLeft=false;
let keyRight=false;
let keyJump=false;
let keyAttack=false;

const fingers=new Map();

function getButtons(){

    const s=Math.min(
        105,
        Math.max(82,W*.15)
    );

    const gap=14;
    const bottom=20;

    return{

        left:{
            x:20,
            y:H-s-bottom,
            w:s,
            h:s
        },

        right:{
            x:20+s+gap,
            y:H-s-bottom,
            w:s,
            h:s
        },

        jump:{
            x:W-s*2-gap-20,
            y:H-s-bottom,
            w:s,
            h:s
        },

        attack:{
            x:W-s-20,
            y:H-s-bottom,
            w:s,
            h:s
        }
    };
}

function getPoint(e){

    const r=canvas.getBoundingClientRect();

    return{
        x:e.clientX-r.left,
        y:e.clientY-r.top
    };
}

function inside(p,b){

    return(
        p.x>=b.x &&
        p.x<=b.x+b.w &&
        p.y>=b.y &&
        p.y<=b.y+b.h
    );
}

function updateTouchControls(){

    touchLeft=false;
    touchRight=false;
    touchJump=false;
    touchAttack=false;

    const b=getButtons();

    for(const p of fingers.values()){

        if(inside(p,b.left)) touchLeft=true;
        if(inside(p,b.right)) touchRight=true;
        if(inside(p,b.jump)) touchJump=true;
        if(inside(p,b.attack)) touchAttack=true;
    }
}


// =====================================================
// POINTER INPUT
// =====================================================

canvas.addEventListener("pointerdown",e=>{

    e.preventDefault();

    const p=getPoint(e);


    // START SCREEN

    if(screen==="start"){

        if(inside(p,getPlayButton())){

            startGame(false);
            return;
        }

        if(inside(p,getSpeedRunButton())){

            startGame(true);
            return;
        }

        return;
    }


    // END SCREEN

    if(gameOver||gameWon){

        if(inside(p,getRetryButton())){

            restart();
            return;
        }

        return;
    }


    // SHOP

    if(shopOpen){

        handleShopTouch(p);
        return;
    }


    // SHOP OPEN

    if(
        nearShop &&
        inside(p,getShopOpenButton())
    ){

        shopOpen=true;
        return;
    }


    fingers.set(e.pointerId,p);

    try{
        canvas.setPointerCapture(e.pointerId);
    }catch(_){}

    updateTouchControls();

},{passive:false});


canvas.addEventListener("pointermove",e=>{

    e.preventDefault();

    if(fingers.has(e.pointerId)){

        fingers.set(
            e.pointerId,
            getPoint(e)
        );

        updateTouchControls();
    }

},{passive:false});


function pointerEnd(e){

    fingers.delete(e.pointerId);
    updateTouchControls();
}

canvas.addEventListener("pointerup",pointerEnd);
canvas.addEventListener("pointercancel",pointerEnd);
canvas.addEventListener("pointerleave",pointerEnd);


// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener("keydown",e=>{

    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")
        keyLeft=true;

    if(k==="arrowright"||k==="d")
        keyRight=true;

    if(k==="arrowup"||k==="w"||k===" "){

        keyJump=true;
        e.preventDefault();
    }

    if(k==="j"||k==="f"||k==="z"){

        keyAttack=true;
        e.preventDefault();
    }

    if(k==="r"){

        if(gameOver||gameWon)
            restart();
    }
});


document.addEventListener("keyup",e=>{

    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")
        keyLeft=false;

    if(k==="arrowright"||k==="d")
        keyRight=false;

    if(k==="arrowup"||k==="w"||k===" ")
        keyJump=false;

    if(k==="j"||k==="f"||k==="z")
        keyAttack=false;
});


// =====================================================
// LEVEL GENERATION
// =====================================================

const levels=[];

const themes=[
    ["#60a5fa","#dbeafe","MEADOW"],
    ["#172033","#475569","CAVERNS"],
    ["#a78bfa","#f5d0fe","SKYLANDS"],
    ["#450a0a","#f97316","VOLCANO"]
];


for(let n=0;n<20;n++){

    const platforms=[];

    let x=0;

    for(let i=0;i<14;i++){

        let y;

        if(i===0){

            y=500;

        }else{

            const previous=
                platforms[i-1][1];

            let change=
                ((i*31+n*17)%121)-60;

            // Keep platforms reachable.

            change=
                Math.max(
                    -70,
                    Math.min(70,change)
                );

            y=
                previous+
                change;

            y=
                Math.max(
                    370,
                    Math.min(520,y)
                );
        }


        const width=
            320+
            ((i*47+n*13)%100);


        platforms.push([
            x,
            y,
            width,
            45
        ]);


        x+=
            width+
            55+
            ((i*17+n*11)%30);
    }


    // Large final platform.

    platforms.push([
        x,
        450,
        850,
        50
    ]);


    const coins=[];

    for(const p of platforms){

        coins.push([
            p[0]+p[2]/2,
            p[1]-35
        ]);
    }


    const monsters=[];

    for(let m=0;m<6;m++){

        const pi=
            Math.min(
                m+1,
                platforms.length-2
            );

        const p=
            platforms[pi];


        let type=1;

        if(n>=5 && m>=2)
            type=2;

        if(n>=10 && m>=3)
            type=3;

        if(n>=15 && m>=4)
            type=4;


        monsters.push({

            platformIndex:pi,

            x:
                p[0]+
                60+
                ((m*73+n*31)%
                Math.max(80,p[2]-120)),

            type:type
        });
    }


    levels.push({

        name:
            themes[
                Math.floor(n/5)
            ][2],

        sky1:
            themes[
                Math.floor(n/5)
            ][0],

        sky2:
            themes[
                Math.floor(n/5)
            ][1],

        platforms,
        coins,
        monsters,

        boss:
            n===9||
            n===19
    });
}

        return{

            damage:5,
            rate:.75,
            width:34,
            height:48,
            color:"#ef4444",
            speed:2.4,

// =====================================================

// =====================================================

function startGame(run){

    screen="game";

    speedRun=run;

    speedRunStart=
        performance.now();

    speedRunTime=0;

    gameOver=false;
    gameWon=false;

    level=0;

    score=0;
    totalCoins=0;
    monstersKilled=0;

    lives=3;

    swordDamage=3;
    swordRarity="COMMON";

    shieldCount=0;
    doubleCoins=0;

    purchasedPermanent.clear();

    loadLevel(0);
}


// =====================================================
// LOAD LEVEL
// =====================================================

function loadLevel(n){

    level=n;

    shopOpen=false;

    const L=levels[level];


    const maxHP=
        20+
        level*10;


    player={

        x:80,
        y:L.platforms[0][1]-48,

        width:34,
        height:48,

        vx:0,
        vy:0,

        speed:7,

        jumpPower:-13,

        ground:false,

        maxHP:maxHP,
        hp:maxHP,

        attackCooldown:0,
        attacking:false,
        attackTimer:0
    };


    coins=L.coins.map(c=>({

        x:c[0],
        y:c[1],

        collected:false
    }));


    enemies=[];


    for(const data of L.monsters){

        const s=
            monsterStats(
                data.type
            );

        const p=
            L.platforms[
                data.platformIndex
            ];


        enemies.push({

            x:
                Math.max(
                    p[0]+10,
                    Math.min(
                        data.x,
                        p[0]+p[2]-s.width-10
                    )
                ),

            y:
                p[1]-s.height,

            width:s.width,
            height:s.height,

            type:data.type,

            hp:s.hp,
            maxHP:s.hp,

            damage:s.damage,
            rate:s.rate,
            speed:s.speed,
            coinReward:s.coins,

            color:s.color,

            vx:0,
            vy:0,

            ground:true,

            active:false,

            attackTimer:0,

            dead:false,
            boss:false
        });
    }


    // =================================================
    // BOSS
    // =================================================

    if(L.boss){

        const final=
            L.platforms[
                L.platforms.length-1
            ];


        const solar=
            level===19;


        const bw=
            solar
            ?204
            :170;

        const bh=
            solar
            ?288
            :240;


        enemies.push({

            x:
                final[0]+
                final[2]-
                bw-
                120,

            y:
                final[1]-bh,

            width:bw,
            height:bh,

            hp:
                solar
                ?50
                :35,

            maxHP:
                solar
                ?50
                :35,

            damage:
                solar
                ?30
                :20,

            rate:
                solar
                ?3.5
                :3,

            boss:true,

            bossName:
                solar
                ?"The Solar"
                :"The Omega",

            bossCoins:
                solar
                ?20
                :10,

            active:false,

            attackTimer:0,

            warning:false,
            warningTimer:0,

            vx:0,
            vy:0,

            ground:true,

            dead:false
        });
    }


    // =================================================
    // PORTAL
    // =================================================

    const final=
        L.platforms[
            L.platforms.length-1
        ];


    portal={

        x:
            final[0]+
            final[2]-90,

        y:
            final[1]-75,

        width:50,
        height:75
    };


    // =================================================
    // SHOP
    // =================================================

    if((level+1)%5===0){

        shop={

            x:
                final[0]+190,

            y:
                final[1]-70,

            width:70,
            height:70
        };

        createShop();

    }else{

        shop=null;
        shopItems=[];
    }


    camera=0;


    message=
        L.boss
        ?"⚠ "+(level===19?"THE SOLAR":"THE OMEGA")+"!"
        :L.name+
         " — LEVEL "+
         (level+1);


    messageTimer=100;
}


// =====================================================
// SHOP CREATION
// =====================================================

function createShop(){

    shopItems=[];


    // Normal items.

    const normal=
        shopPool.filter(item=>{

            if(
                !item.repeat &&
                purchasedPermanent.has(item.id)
            )
                return false;

            return true;
        });


    // Add up to 2 normal items.

    const availableNormal=
        [...normal];


    while(
        shopItems.length<2 &&
        availableNormal.length
    ){

        const index=
            Math.floor(
                Math.random()*
                availableNormal.length
            );

        shopItems.push(
            availableNormal[index]
        );

        availableNormal.splice(
            index,
            1
        );
    }


    // =================================================
    // ONE RANDOM SWORD
    // =================================================
    //
    // Weighted chances:
    //
    // Uncommon 39
    // Rare 25
    // Epic 20
    // Legendary 10
    // Mythic 5
    // Secret .9
    // Eternal .1
    //
    // Total = 100
    //
    // ONLY ONE sword can appear per shop.

    const sword=
        getRandomSword();


    if(sword)
        shopItems.push(sword);
}


// =====================================================
// RANDOM SWORD
// =====================================================

function getRandomSword(){

    const roll=
        Math.random()*100;

    let total=0;

    for(const sword of weaponPool){

        total+=sword.chance;

        if(roll<total){

            // Don't replace current sword
            // with something weaker.

            if(
                sword.damage<=swordDamage
            ){

                return null;
            }

            return sword;
        }
    }

    return null;
}


// =====================================================
// SHOP BUTTON
// =====================================================

function getShopOpenButton(){

    return{

        x:W/2-115,
        y:H-155,

        w:230,
        h:60
    };
}


// =====================================================
// SHOP TOUCH
// =====================================================

function handleShopTouch(p){

    if(!shopOpen)
        return;


    const cardW=
        Math.min(
            200,
            (W-50)/3
        );

    const gap=10;

    const total=
        cardW*3+
        gap*2;

    const start=
        W/2-total/2;


    for(
        let i=0;
        i<shopItems.length;
        i++
    ){

        const x=
            start+
            i*(cardW+gap);

        const y=145;


        const buyBox={

            x:x+10,
            y:y+170,

            w:cardW-20,
            h:55
        };


        if(inside(p,buyBox)){

            buyShopItem(i);
            return;
        }
    }


    const close={

        x:W/2-85,
        y:H-90,

        w:170,
        h:55
    };


    if(inside(p,close)){

        shopOpen=false;
    }
}


// =====================================================
// BUY SHOP ITEM
// =====================================================

function buyShopItem(index){

    const item=
        shopItems[index];

    if(!item)
        return;


    if(score<item.price){

        message=
            "❌ NOT ENOUGH COINS!";

        messageTimer=55;

        return;
    }


    score-=item.price;


    if(item.id==="life"){

        lives++;

        message="❤️ +1 LIFE!";
    }


    else if(item.id==="heal"){

        if(player.hp>=player.maxHP){

            score+=item.price;

            message=
                "❤️ HP IS ALREADY FULL!";

            messageTimer=55;

            return;
        }

        player.hp=
            Math.min(
                player.maxHP,
                player.hp+10
            );

        message="💚 +10 HP!";
    }


    else if(item.id==="shield"){

        shieldCount++;

        message=
            "🛡 SHIELD ADDED!";
    }


    else if(item.id==="double"){

        // Each purchase adds another 60 seconds.

        doubleCoins+=60;

        message=
            "🪙 2X COINS FOR 60 SECONDS!";
    }


    else if(item.id==="jump"){

        player.jumpPower-=1.5;

        purchasedPermanent.add(item.id);

        message="🦘 JUMP BOOST!";
    }


    else if(item.id==="speed"){

        player.speed+=1;

        purchasedPermanent.add(item.id);

        message="💨 SPEED BOOST!";
    }


    else if(item.id==="strength"){

        swordDamage+=2;

        purchasedPermanent.add(item.id);

        message="💪 STRENGTH UP!";
    }


    else if(item.id==="maxhp"){

        player.maxHP+=10;
        player.hp+=10;

        purchasedPermanent.add(item.id);

        message="❤️ MAX HP +10!";
    }


    else if(item.damage){

        swordDamage=item.damage;

        swordRarity=item.rarity;

        message=
            "⚔ "+item.name+"!";

        purchasedPermanent.add(item.id);
    }


    messageTimer=70;


    // IMPORTANT:
    //
    // The item is removed permanently from THIS shop.
    // The shop does NOT refill.

    shopItems.splice(
        index,
        1
    );
}


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){

    return(

        a.x<b.x+b.width &&
        a.x+a.width>b.x &&
        a.y<b.y+b.height &&
        a.y+a.height>b.y
    );
}


// =====================================================
// MOVE ENTITY
// =====================================================

function moveEntity(e,platforms){

    e.vy+=.65;

    if(e.vy>17)
        e.vy=17;


    const oldY=e.y;

    e.x+=e.vx;
    e.y+=e.vy;

    e.ground=false;


    for(const p of platforms){

        const plat={

            x:p[0],
            y:p[1],

            width:p[2],
            height:p[3]
        };


        if(!collision(e,plat))
            continue;


        const oldBottom=
            oldY+e.height;

        const newBottom=
            e.y+e.height;


        if(
            e.vy>=0 &&
            oldBottom<=plat.y+15 &&
            newBottom>=plat.y
        ){

            e.y=
                plat.y-e.height;

            e.vy=0;

            e.ground=true;
        }


        else if(e.vy<0){

            e.y=
                plat.y+
                plat.height;

            e.vy=0;
        }
    }
}


// =====================================================
// PLATFORM BELOW
// =====================================================

function platformBelow(e,platforms){

    let result=null;
    let closest=Infinity;

    for(const p of platforms){

        const overlap=
            e.x+e.width>p[0] &&
            e.x<p[0]+p[2];


        if(!overlap)
            continue;


        const d=
            p[1]-
            (e.y+e.height);


        if(
            d>=-12 &&
            d<closest
        ){

            closest=d;
            result=p;
        }
    }


    return result;
}


// =====================================================
// DAMAGE PLAYER
// =====================================================

function damagePlayer(amount){

    if(gameOver||gameWon)
        return;


    // Shield blocks ONE hit.

    if(shieldCount>0){

        shieldCount--;

        message=
            "🛡 SHIELD BLOCKED THE ATTACK!";

        messageTimer=55;

        return;
    }


    player.hp-=amount;


    if(player.hp<=0){

        lives--;


        if(lives<=0){

            gameOver=true;

            if(speedRun){

                speedRunTime=
                    (performance.now()-
                    speedRunStart)/1000;
            }

            return;
        }


        // Respawn at beginning
        // of CURRENT LEVEL.

        player.x=80;

        player.y=
            levels[level].platforms[0][1]-
            player.height;

        player.vx=0;
        player.vy=0;

        player.hp=
            player.maxHP;

        camera=0;

        message=
            "💥 RESPAWN!";

        messageTimer=80;
    }
}


// =====================================================
// ATTACK
// =====================================================

function attack(){

    if(gameOver||gameWon||screen!=="game")
        return;


    // 0.5 second attack cooldown.

    if(player.attackCooldown>0)
        return;


    player.attackCooldown=.5;

    player.attacking=true;

    player.attackTimer=.22;


    const facing=
        player.vx<0
        ?-1
        :1;


    for(const enemy of enemies){

        if(enemy.dead)
            continue;


        const dx=
            enemy.x-player.x;

        const dy=
            Math.abs(
                enemy.y-player.y
            );


        const inFront=
            dx*facing>=-25 &&
            dx*facing<=125;


        if(
            inFront &&
            dy<140
        ){

            enemy.hp-=swordDamage;


            if(enemy.hp<=0){

                enemy.dead=true;

                monstersKilled++;


                let reward=0;


                if(enemy.boss){

                    reward=
                        enemy.bossCoins;

                }else{

                    reward=
                        enemy.coinReward;
                }


                if(doubleCoins>0)
                    reward*=2;


                score+=reward;
                totalCoins+=reward;


                message=
                    enemy.boss
                    ?"🏆 "+enemy.bossName+
                     " DEFEATED! +"+
                     reward+
                     " COINS!"
                    :"+"+
                     reward+
                     " COINS!";


                messageTimer=60;
            }
        }
    }
}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemy(e,L,dt){

    if(e.dead)
        return;


    // =================================================
    // BOSS
    // =================================================

    if(e.boss){

        if(
            Math.abs(
                player.x-e.x
            )<750
        ){

            e.active=true;
        }


        if(!e.active)
            return;


        e.attackTimer+=dt;


        if(
            e.attackTimer>=e.rate &&
            !e.warning
        ){

            e.attackTimer=0;

            e.warning=true;

            e.warningTimer=.5;
        }


        if(e.warning){

            e.warningTimer-=dt;


            if(
                e.warningTimer<=0
            ){

                e.warning=false;


                const center=
                    e.x+
                    e.width/2;

                const pc=
                    player.x+
                    player.width/2;


                // Boss only attacks directly
                // in front of itself.

                if(
                    Math.abs(
                        pc-center
                    )<
                    e.width/2+120
                ){

                    damagePlayer(
                        e.damage
                    );
                }
            }
        }


        return;
    }


    // =================================================
    // NORMAL MONSTERS
    // =================================================

    // Remove monsters that fell
    // into the void.

    if(
        e.y>
        H+700
    ){

        e.dead=true;
        return;
    }


    // =================================================
    // DETERMINE PLATFORMS
    // =================================================

    const monsterPlatform=
        platformBelow(
            e,
            L.platforms
        );


    const playerPlatform=
        platformBelow(
            player,
            L.platforms
        );


    // =================================================
    // SAME PLATFORM DETECTION
    // =================================================

    let samePlatform=false;


    if(
        monsterPlatform &&
        playerPlatform
    ){

        samePlatform=
            monsterPlatform===
            playerPlatform;


        // Make sure both are actually
        // above the same platform.

        if(
            player.x+player.width<
            monsterPlatform[0] ||

            player.x>
            monsterPlatform[0]+
            monsterPlatform[2]
        ){

            samePlatform=false;
        }
    }


    // =================================================
    // DIFFERENT PLATFORM = NO SIGHT
    // =================================================

    if(!samePlatform){

        e.active=false;

        e.vx=0;

        e.attackTimer=0;

        return;
    }


    // =================================================
    // SAME PLATFORM = CHASE
    // =================================================

    e.active=true;


    const dx=
        player.x-e.x;


    const distance=
        Math.abs(dx);


    if(distance>900){

        e.active=false;
        e.vx=0;
        e.attackTimer=0;

        return;
    }


    const dir=
        dx>0
        ?1
        :-1;


    e.vx=
        dir*
        e.speed;


    // =================================================
    // JUMP UP
    // =================================================

    if(
        e.ground &&
        monsterPlatform &&
        playerPlatform &&
        playerPlatform[1]<
        monsterPlatform[1]-25
    ){

        e.vy=-12;
    }


    // =================================================
    // PHYSICS
    // =================================================

    moveEntity(
        e,
        L.platforms
    );


    // =================================================
    // ATTACK
    // =================================================

    const newMonsterPlatform=
        platformBelow(
            e,
            L.platforms
        );


    const newPlayerPlatform=
        platformBelow(
            player,
            L.platforms
        );


    // If the monster is no longer on
    // the player's platform, immediately
    // stop its attack.

    if(
        newMonsterPlatform===
        null ||
        newMonsterPlatform!==
        newPlayerPlatform
    ){

        e.active=false;

        e.vx=0;

        e.attackTimer=0;

        return;
    }


    if(
        collision(
            player,
            e
        )
    ){

        e.attackTimer+=dt;


        if(
            e.attackTimer>=e.rate
        ){

            e.attackTimer=0;

            damagePlayer(
                e.damage
            );
        }

    }else{

        e.attackTimer=0;
    }
}


// =====================================================
// UPDATE
// =====================================================

function update(){

    const now=
        performance.now();


    let dt=
        (now-lastTime)/1000;


    lastTime=now;


    dt=
        Math.min(dt,.05);


    if(screen!=="game")
        return;


    if(gameOver||gameWon)
        return;


    // =================================================
    // SPEED RUN TIMER
    // =================================================

    if(speedRun){

        speedRunTime=
            (now-speedRunStart)/1000;
    }


    // =================================================
    // 2X COIN TIMER
    // =================================================

    if(doubleCoins>0){

        doubleCoins-=dt;

        if(doubleCoins<0)
            doubleCoins=0;
    }


    // SHOP PAUSE

    if(shopOpen)
        return;


    const L=
        levels[level];


    // =================================================
    // SHOP DISTANCE
    // =================================================

    nearShop=false;


    if(shop){

        const dx=
            Math.abs(
                player.x-shop.x
            );

        const dy=
            Math.abs(
                player.y-shop.y
            );


        nearShop=
            dx<170 &&
            dy<150;
    }


    // =================================================
    // CONTROLS
    // =================================================

    const left=
        keyLeft||
        touchLeft;

    const right=
        keyRight||
        touchRight;

    const jump=
        keyJump||
        touchJump;

    const attacking=
        keyAttack||
        touchAttack;


    // =================================================
    // MOVEMENT
    // =================================================

    if(left)
        player.vx-=.8;

    if(right)
        player.vx+=.8;


    if(!left&&!right)
        player.vx*=.82;


    player.vx=
        Math.max(
            -player.speed,
            Math.min(
                player.speed,
                player.vx
            )
        );


    // =================================================
    // JUMP
    // =================================================

    if(
        jump &&
        player.ground
    ){

        player.vy=
            player.jumpPower;

        player.ground=false;
    }


    // =================================================
    // ATTACK
    // =================================================

    if(attacking)
        attack();


    if(player.attackCooldown>0){

        player.attackCooldown-=dt;

        if(player.attackCooldown<0)
            player.attackCooldown=0;
    }


    if(player.attacking){

        player.attackTimer-=dt;

        if(player.attackTimer<=0){

            player.attacking=false;
        }
    }


    // =================================================
    // PLAYER PHYSICS
    // =================================================

    moveEntity(
        player,
        L.platforms
    );


    player.x=
        Math.max(
            0,
            player.x
        );


    // =================================================
    // COINS
    // =================================================

    for(const c of coins){

        if(c.collected)
            continue;


        const d=
            Math.hypot(

                player.x+
                player.width/2-
                c.x,

                player.y+
                player.height/2-
                c.y
            );


        if(d<35){

            c.collected=true;


            let reward=1;


            if(doubleCoins>0)
                reward=2;


            score+=reward;
            totalCoins+=reward;


            message=
                "+"+
                reward+
                " COIN"+
                (reward>1?"S":"")+"!";


            messageTimer=30;
        }
    }


    // =================================================
    // ENEMIES
    // =================================================

    for(const e of enemies){

        updateEnemy(
            e,
            L,
            dt
        );
    }


    enemies=
        enemies.filter(
            e=>!e.dead
        );


    // =================================================
    // PORTAL
    // =================================================

    const bossAlive=
        enemies.some(
            e=>e.boss
        );


    if(
        portal &&
        collision(
            player,
            portal
        ) &&
        !bossAlive
    ){

        if(level<19){

            loadLevel(
                level+1
            );

        }else{

            gameWon=true;

            if(speedRun){

                speedRunTime=
                    (performance.now()-
                    speedRunStart)/1000;
            }
        }
    }


    // =================================================
    // FALL
    // =================================================

    if(
        player.y>
        H+500
    ){

        damagePlayer(
            player.maxHP
        );
    }


    // =================================================
    // CAMERA
    // =================================================

    const final=
        L.platforms[
            L.platforms.length-1
        ];


    const worldWidth=
        final[0]+
        final[2]+
        150;


    camera+=
        (
            player.x-
            W*.35-
            camera
        )*.1;


    camera=
        Math.max(
            0,
            Math.min(
                Math.max(
                    0,
                    worldWidth-W
                ),
                camera
            )
        );


    if(messageTimer>0)
        messageTimer--;
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    if(screen==="start"){

        drawStartScreen();
        return;
    }


    const L=
        levels[level];


    // =================================================
    // SKY
    // =================================================

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );


    gradient.addColorStop(
        0,
        L.sky1
    );


    gradient.addColorStop(
        1,
        L.sky2
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    ctx.translate(
        -camera,
        0
    );


    // =================================================
    // BACKGROUND
    // =================================================

    ctx.fillStyle=
        "rgba(255,255,255,.13)";


    for(
        let i=-2;
        i<30;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i*600,
            700
        );

        ctx.lineTo(
            i*600+300,
            180
        );

        ctx.lineTo(
            i*600+650,
            700
        );

        ctx.fill();
    }


    // =================================================
    // PLATFORMS
    // =================================================

    for(const p of L.platforms){

        ctx.fillStyle=
            "#263244";


        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            p[3]
        );


        ctx.fillStyle=
            level>=15
            ?" #fb923c"
            :" #22c55e";


        ctx.fillStyle=
            ctx.fillStyle.trim();


        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            7
        );
    }


    // =================================================
    // SHOP
    // =================================================

    if(shop){

        ctx.fillStyle="#78350f";


        ctx.fillRect(
            shop.x,
            shop.y,
            shop.width,
            shop.height
        );


        ctx.fillStyle="#fbbf24";


        ctx.fillRect(
            shop.x-8,
            shop.y-18,
            shop.width+16,
            22
        );


        ctx.fillStyle="white";

        ctx.font=
            "bold 18px Arial";

        ctx.textAlign="center";


        ctx.fillText(
            "SHOP",
            shop.x+
            shop.width/2,
            shop.y+45
        );


        ctx.textAlign="left";
    }


    // =================================================
    // COINS
    // =================================================

    for(const c of coins){

        if(c.collected)
            continue;


        ctx.fillStyle="#facc15";


        ctx.beginPath();


        ctx.arc(
            c.x,
            c.y,
            11,
            0,
            Math.PI*2
        );


        ctx.fill();


        ctx.fillStyle="white";


        ctx.beginPath();


        ctx.arc(
            c.x-3,
            c.y-3,
            3,
            0,
            Math.PI*2
        );


        ctx.fill();
    }


    // =================================================
    // MONSTERS
    // =================================================

    for(const e of enemies){

        if(e.boss){

            drawBoss(e);

            continue;
        }


        ctx.fillStyle=e.color;


        ctx.fillRect(
            e.x,
            e.y,
            e.width,
            e.height
        );


        ctx.fillStyle="#111827";


        ctx.fillRect(
            e.x+e.width*.2,
            e.y+e.height*.2,
            7,
            7
        );


        ctx.fillRect(
            e.x+e.width*.6,
            e.y+e.height*.2,
            7,
            7
        );


        drawHealth(
            e.x,
            e.y-14,
            e.width,
            7,
            e.hp,
            e.maxHP
        );
    }


    // =================================================
    // PORTAL
    // =================================================

    const bossAlive=
        enemies.some(
            e=>e.boss
        );


    if(portal){

        ctx.fillStyle="white";


        ctx.fillRect(
            portal.x,
            portal.y,
            7,
            portal.height
        );


        ctx.fillStyle=
            bossAlive
            ?" #64748b"
            :" #a855f7";


        ctx.fillStyle=
            ctx.fillStyle.trim();


        ctx.beginPath();


        ctx.moveTo(
            portal.x+7,
            portal.y
        );


        ctx.lineTo(
            portal.x+65,
            portal.y+20
        );


        ctx.lineTo(
            portal.x+7,
            portal.y+40
        );


        ctx.closePath();


        ctx.fill();


        ctx.fillStyle="white";


        ctx.font=
            "bold 13px Arial";


        ctx.fillText(
            bossAlive
            ?"DEFEAT BOSS"
            :"NEXT LEVEL",
            portal.x-20,
            portal.y-12
        );
    }


    // =================================================
    // PLAYER
    // =================================================

    ctx.fillStyle="#7c3aed";


    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    ctx.fillStyle="white";


    ctx.fillRect(
        player.x+6,
        player.y+10,
        7,
        7
    );


    ctx.fillRect(
        player.x+20,
        player.y+10,
        7,
        7
    );


    // =================================================
    // SWORD SLASH
    // =================================================

    if(player.attacking){

        ctx.save();


        const facing=
            player.vx<0
            ?-1
            :1;


        ctx.translate(
            player.x+
            player.width/2,
            player.y+
            player.height/2
        );


        const progress=
            1-
            player.attackTimer/.22;


        ctx.rotate(
            facing*
            (-1.1+
            progress*2.2)
        );


        // Eternal sword:
        // black outside with red center.

        if(swordRarity==="???"){

            ctx.fillStyle="#050505";

            ctx.fillRect(
                facing*5,
                -7,
                facing*75,
                14
            );


            ctx.fillStyle="#ef4444";

            ctx.fillRect(
                facing*5,
                -3,
                facing*75,
                6
            );

        }else{

            ctx.fillStyle=
                swordColor();


            ctx.fillRect(
                facing*5,
                -5,
                facing*65,
                10
            );
        }


        ctx.fillStyle="#78350f";


        ctx.fillRect(
            facing*-10,
            -4,
            20,
            8
        );


        ctx.restore();
    }


    // =================================================
    // BOSS WARNING
    // =================================================

    for(const e of enemies){

        if(
            e.boss &&
            e.warning
        ){

            ctx.fillStyle=
                "rgba(255,0,0,.3)";


            ctx.fillRect(
                e.x-120,
                e.y+e.height-18,
                e.width+240,
                35
            );


            ctx.fillStyle="white";


            ctx.font=
                "bold 20px Arial";


            ctx.fillText(
                "⚠ INCOMING SLAM!",
                e.x-70,
                e.y-25
            );
        }
    }


    ctx.restore();


    drawHUD();

    drawControls();


    // =================================================
    // SHOP BUTTON
    // =================================================

    if(
        nearShop &&
        !shopOpen
    ){

        const b=
            getShopOpenButton();


        ctx.fillStyle=
            "rgba(0,0,0,.75)";


        ctx.fillRect(
            b.x,
            b.y,
            b.w,
            b.h
        );


        ctx.strokeStyle="#fbbf24";


        ctx.lineWidth=3;


        ctx.strokeRect(
            b.x,
            b.y,
            b.w,
            b.h
        );


        ctx.fillStyle="white";


        ctx.textAlign="center";


        ctx.font=
            "bold 20px Arial";


        ctx.fillText(
            "🏪 TAP TO SHOP",
            W/2,
            b.y+39
        );


        ctx.textAlign="left";
    }


    // =================================================
    // MESSAGE
    // =================================================

    if(messageTimer>0){

        ctx.fillStyle=
            "rgba(0,0,0,.65)";


        ctx.fillRect(
            W/2-155,
            125,
            310,
            55
        );


        ctx.fillStyle="white";


        ctx.textAlign="center";


        ctx.font=
            "bold 20px Arial";


        ctx.fillText(
            message,
            W/2,
            160
        );


        ctx.textAlign="left";
    }


    if(shopOpen)
        drawShop();


    if(gameOver||gameWon)
        drawEndScreen();
}


// =====================================================
// SWORD COLOR
// =====================================================

function swordColor(){

    if(swordRarity==="COMMON")
        return "#9ca3af";

    if(swordRarity==="UNCOMMON")
        return "#22c55e";

    if(swordRarity==="RARE")
        return "#3b82f6";

    if(swordRarity==="EPIC")
        return "#a855f7";

    if(swordRarity==="LEGENDARY")
        return "#facc15";

    if(swordRarity==="MYTHIC")
        return "#ef4444";

    if(swordRarity==="SECRET")
        return "#06b6d4";

    if(swordRarity==="???")
        return "#ef4444";

    return "#9ca3af";
}

// =====================================================
// FORMAT TIME
// =====================================================

function formatTime(seconds){

    const min=
        Math.floor(seconds/60);

    const sec=
        seconds%60;


    return(
        String(min).padStart(2,"0")+
        ":"+
        sec.toFixed(2).padStart(5,"0")
    );
}

        "◀",
        b.left.x+b.left.w/2,
        b.left.y+48
    );


    ctx.fillText(
        "▶",
        b.right.x+b.right.w/2,
        b.right.y+48
    );


    ctx.fillText(
        "▲",
        b.jump.x+b.jump.w/2,
        b.jump.y+48
    );


    ctx.font=
        "bold 27px Arial";


    ctx.fillText(
        "⚔",
        b.attack.x+b.attack.w/2,
        b.attack.y+48
    );


    ctx.textAlign="left";
}


function drawControl(b,active){

    ctx.fillStyle=
        active
        ?"rgba(255,255,255,.45)"
        :"rgba(255,255,255,.18)";


    ctx.strokeStyle=
        "rgba(255,255,255,.75)";


    ctx.lineWidth=2;


    ctx.beginPath();


    ctx.roundRect(
        b.x,
        b.y,
        b.w,
        b.h,
        20
    );


    ctx.fill();
    ctx.stroke();
}


// =====================================================
// SHOP DRAW
// =====================================================

function drawShop(){

    ctx.fillStyle=
        "rgba(0,0,0,.90)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="white";


    ctx.textAlign="center";


    ctx.font=
        "bold 30px Arial";


    ctx.fillText(
        "🏪 SHOP",
        W/2,
        55
    );


    ctx.font="17px Arial";


    ctx.fillText(
        "🪙 Coins: "+
        score,
        W/2,
        85
    );


    const cardW=
        Math.min(
            200,
            (W-50)/3
        );


    const gap=10;


    const total=
        cardW*3+
        gap*2;


    const start=
        W/2-total/2;


    for(
        let i=0;
        i<shopItems.length;
        i++
    ){

        const item=
            shopItems[i];


        const x=
            start+
            i*(cardW+gap);


        const y=125;


        ctx.fillStyle=
            "rgba(255,255,255,.12)";


        ctx.fillRect(
            x,
            y,
            cardW,
            245
        );


        ctx.strokeStyle=
            item.damage
            ?(
                item.rarity==="???"
                ?"red"
                :swordColor()
            )
            :"rgba(255,255,255,.35)";


        ctx.lineWidth=3;


        ctx.strokeRect(
            x,
            y,
            cardW,
            245
        );


        ctx.fillStyle="white";


        ctx.font=
            "bold 15px Arial";


        ctx.fillText(
            item.name,
            x+cardW/2,
            y+40
        );


        ctx.font="12px Arial";


        ctx.fillText(
            item.description,
            x+cardW/2,
            y+75
        );


        if(item.damage){

            ctx.fillStyle=
                item.rarity==="???"
                ?"red"
                :swordColor();


            ctx.font=
                "bold 17px Arial";


            ctx.fillText(
                item.rarity+
                " • "+
                item.damage+
                " DMG",
                x+cardW/2,
                y+112
            );


            ctx.fillStyle="white";


            ctx.font="11px Arial";


            ctx.fillText(
                "Shop chance: "+
                item.chance+"%",
                x+cardW/2,
                y+135
            );
        }


        ctx.fillStyle="white";


        ctx.font=
            "bold 18px Arial";


        ctx.fillText(
            "🪙 "+
            item.price,
            x+cardW/2,
            y+155
        );


        const affordable=
            score>=item.price;


        ctx.fillStyle=
            affordable
            ?"rgba(34,197,94,.85)"
            :"rgba(90,90,90,.7)";


        ctx.fillRect(
            x+10,
            y+170,
            cardW-20,
            55
        );


        ctx.fillStyle="white";


        ctx.font=
            "bold 15px Arial";


        ctx.fillText(
            affordable
            ?"BUY"
            :"CAN'T AFFORD",
            x+cardW/2,
            y+205
        );
    }


    // CLOSE

    ctx.fillStyle=
        "rgba(239,68,68,.85)";


    ctx.fillRect(
        W/2-85,
        H-90,
        170,
        55
    );


    ctx.fillStyle="white";


    ctx.font=
        "bold 18px Arial";


    ctx.fillText(
        "CLOSE",
        W/2,
        H-55
    );


    ctx.textAlign="left";
}


// =====================================================
// START SCREEN BUTTONS
// =====================================================

function getPlayButton(){

    return{

        x:W/2-130,
        y:H/2-45,

        w:260,
        h:70
    };
}


function getSpeedRunButton(){

    return{

        x:W/2-130,
        y:H/2+45,

        w:260,
        h:70
    };
}


// =====================================================
// START SCREEN
// =====================================================

function drawStartScreen(){

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );


    gradient.addColorStop(
        0,
        "#1d4ed8"
    );


    gradient.addColorStop(
        1,
        "#111827"
    );


    ctx.fillStyle=gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="white";


    ctx.textAlign="center";


    ctx.font=
        "bold 42px Arial";


    ctx.fillText(
        "⚔ SKY BOUND RUNNER",
        W/2,
        H/2-160
    );


    ctx.font="18px Arial";


    ctx.fillText(
        "20 LEVELS • BOSSES • SHOPS • SWORDS",
        W/2,
        H/2-120
    );


    const play=
        getPlayButton();


    ctx.fillStyle=
        "rgba(34,197,94,.9)";


    ctx.fillRect(
        play.x,
        play.y,
        play.w,
        play.h
    );


    ctx.fillStyle="white";


    ctx.font=
        "bold 27px Arial";


    ctx.fillText(
        "▶ PLAY",
        W/2,
        play.y+45
    );


    const speed=
        getSpeedRunButton();


    ctx.fillStyle=
        "rgba(168,85,247,.9)";


    ctx.fillRect(
        speed.x,
        speed.y,
        speed.w,
        speed.h
    );


    ctx.fillStyle="white";


    ctx.fillText(
        "⏱ SPEED RUN",
        W/2,
        speed.y+45
    );


    ctx.font="14px Arial";


    ctx.fillText(
        "Speed Run stops the timer when you beat Level 20.",
        W/2,
        H/2+145
    );


    ctx.textAlign="left";
}


// =====================================================
// RETRY BUTTON
// =====================================================

function getRetryButton(){

    return{

        x:W/2-125,
        y:H/2+120,

        w:250,
        h:70
    };
}


// =====================================================
// END SCREEN
// =====================================================

function drawEndScreen(){

    ctx.fillStyle=
        "rgba(0,0,0,.88)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="white";


    ctx.textAlign="center";


    ctx.font=
        "bold 30px Arial";


    ctx.fillText(
        gameWon
        ?"🏆 YOU BEAT ALL 20 LEVELS!"
        :"💀 GAME OVER",
        W/2,
        H/2-130
    );


    ctx.font="19px Arial";


    if(speedRun){

        ctx.fillText(
            gameWon
            ?"⏱ SPEED RUN TIME: "+
             formatTime(speedRunTime)
            :"⏱ TIME: "+
             formatTime(speedRunTime),
            W/2,
            H/2-85
        );
    }


    ctx.fillText(
        "Level reached: "+
        (level+1),
        W/2,
        H/2-45
    );


    ctx.fillText(
        "🪙 Total coins: "+
        totalCoins,
        W/2,
        H/2-10
    );


    ctx.fillText(
        "☠ Monsters defeated: "+
        monstersKilled,
        W/2,
        H/2+25
    );


    ctx.fillText(
        "⚔ Sword: "+
        swordRarity+
        " ("+
        swordDamage+
        " damage)",
        W/2,
        H/2+60
    );


    // =================================================
    // MOBILE RETRY BUTTON
    // =================================================

    const retry=
        getRetryButton();


    ctx.fillStyle=
        "rgba(34,197,94,.95)";


    ctx.fillRect(
        retry.x,
        retry.y,
        retry.w,
        retry.h
    );


    ctx.fillStyle="white";


    ctx.font=
        "bold 24px Arial";


    ctx.fillText(
        "🔄 PLAY AGAIN",
        W/2,
        retry.y+45
    );


    ctx.font="14px Arial";


    ctx.fillText(
        "You can also press R.",
        W/2,
        retry.y+95
    );


    ctx.textAlign="left";
}


// =====================================================
// RESTART
// =====================================================

function restart(){

    screen="game";

    level=0;

    score=0;

    totalCoins=0;

    monstersKilled=0;

    lives=3;

    swordDamage=3;

    swordRarity="COMMON";

    shieldCount=0;

    doubleCoins=0;

    purchasedPermanent.clear();

    camera=0;

    gameOver=false;
    gameWon=false;

    shopOpen=false;

    speedRunStart=
        performance.now();

    speedRunTime=0;

    loadLevel(0);
}


// =====================================================
// START
// =====================================================

screen="start";


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();

</script>
