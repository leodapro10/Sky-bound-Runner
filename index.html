<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,dpr=1;

function resize(){
    W=innerWidth;
    H=innerHeight;
    dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=W*dpr;
    canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",resize);
resize();


// =====================================================
// GAME STATES
// =====================================================

let screen="start";
// start, game, gameover, won

let speedRun=false;
let speedRunStart=0;
let speedRunEnd=0;


// =====================================================
// INPUT
// =====================================================

let touchLeft=false;
let touchRight=false;
let touchJump=false;
let touchAttack=false;

let keyLeft=false;
let keyRight=false;
let keyJump=false;
let keyAttack=false;

const fingers=new Map();

function getButtons(){
    const s=Math.min(105,Math.max(82,W*.14));
    const gap=14;
    const bottom=20;

    return {
        left:{
            x:20,
            y:H-s-bottom,
            w:s,
            h:s
        },
        right:{
            x:20+s+gap,
            y:H-s-bottom,
            w:s,
            h:s
        },
        jump:{
            x:W-s*2-gap-20,
            y:H-s-bottom,
            w:s,
            h:s
        },
        attack:{
            x:W-s-20,
            y:H-s-bottom,
            w:s,
            h:s
        }
    };
}

function point(e){
    const r=canvas.getBoundingClientRect();
    return {
        x:e.clientX-r.left,
        y:e.clientY-r.top
    };
}

function inside(p,b){
    return p.x>=b.x &&
           p.x<=b.x+b.w &&
           p.y>=b.y &&
           p.y<=b.y+b.h;
}

function updateTouches(){
    touchLeft=false;
    touchRight=false;
    touchJump=false;
    touchAttack=false;

    const b=getButtons();

    for(const p of fingers.values()){
        if(inside(p,b.left))touchLeft=true;
        if(inside(p,b.right))touchRight=true;
        if(inside(p,b.jump))touchJump=true;
        if(inside(p,b.attack))touchAttack=true;
    }
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();

    const p=point(e);

    // START SCREEN
    if(screen==="start"){
        if(inside(p,getPlayButton())){
            startGame(false);
            return;
        }

        if(inside(p,getSpeedButton())){
            startGame(true);
            return;
        }
    }

    // RETRY / END SCREEN
    if(screen==="gameover"||screen==="won"){
        if(inside(p,getRetryButton())){
            startGame(speedRun);
            return;
        }

        if(inside(p,getHomeButton())){
            screen="start";
            return;
        }
    }

    // SHOP
    if(shopOpen){
        handleShopTouch(p);
        return;
    }

    // OPEN SHOP
    if(nearShop && inside(p,getShopOpenButton())){
        shopOpen=true;
        return;
    }

    fingers.set(e.pointerId,p);

    try{
        canvas.setPointerCapture(e.pointerId);
    }catch(_){}

    updateTouches();
},{passive:false});

canvas.addEventListener("pointermove",e=>{
    e.preventDefault();

    if(fingers.has(e.pointerId)){
        fingers.set(e.pointerId,point(e));
        updateTouches();
    }
},{passive:false});

function pointerEnd(e){
    fingers.delete(e.pointerId);
    updateTouches();
}

canvas.addEventListener("pointerup",pointerEnd);
canvas.addEventListener("pointercancel",pointerEnd);

document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")keyLeft=true;
    if(k==="arrowright"||k==="d")keyRight=true;

    if(k==="arrowup"||k==="w"||k===" "){
        keyJump=true;
        e.preventDefault();
    }

    if(k==="j"||k==="f"||k==="z"){
        keyAttack=true;
        e.preventDefault();
    }

    if(k==="r"){
        if(screen==="gameover"||screen==="won")
            startGame(speedRun);
    }
});

document.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase();

    if(k==="arrowleft"||k==="a")keyLeft=false;
    if(k==="arrowright"||k==="d")keyRight=false;
    if(k==="arrowup"||k==="w"||k===" ")keyJump=false;
    if(k==="j"||k==="f"||k==="z")keyAttack=false;
});

// BUTTONS
// =====================================================

function getPlayButton(){
    return {
        x:W/2-130,
        y:H/2-50,
        w:260,
        h:65

}

function getSpeedButton(){
    return {
        x:W/2-130,
        y:H/2+35,
        w:260,
        h:65
    };
}

function getRetryButton(){
    return {
        x:W/2-130,
        y:H/2+90,
        w:260,
        h:65
    };
}

function getHomeButton(){
    return {
        x:W/2-130,
        y:H/2+170,
        w:260,
        h:60
    };
}


// =====================================================
// LEVEL GENERATION
// =====================================================

const levels=[];

const themes=[
    ["#60a5fa","#dbeafe","MEADOW"],
    ["#172033","#475569","CAVERNS"],
    ["#a78bfa","#f5d0fe","SKYLANDS"],
    ["#450a0a","#f97316","VOLCANO"]
];

for(let n=0;n<20;n++){

    const platforms=[];
    let x=0;

    for(let i=0;i<15;i++){

        let y;

        if(i===0){
            y=500;
        }else{
            const prev=platforms[i-1][1];

            // Keep platforms reachable.
            const change=((i*31+n*17)%81)-40;

            y=Math.max(
                360,
                Math.min(520,prev+change)
            );
        }

        const width=330+((i*47+n*13)%100);

        platforms.push([x,y,width,45]);

        x+=width+55+((i*17+n*11)%30);
    }

    platforms.push([x,450,850,50]);

    const coins=[];

    for(const p of platforms){
        coins.push([
            p[0]+p[2]/2,
            p[1]-35
        ]);
    }

    const monsters=[];

    for(let m=0;m<7;m++){

        let type=1;

        if(n>=5&&m>=3)type=2;
        if(n>=10&&m>=4)type=3;
        if(n>=15&&m>=5)type=4;

        const pi=Math.min(
            m+1,
            platforms.length-2
        );

        const p=platforms[pi];

        // Spawn ON the platform.
        monsters.push({
            x:p[0]+40+(m*43%(Math.max(80,p[2]-80))),
            platformIndex:pi,
            type:type
        });
    }

    levels.push({
        name:themes[Math.floor(n/5)][2],
        sky1:themes[Math.floor(n/5)][0],
        sky2:themes[Math.floor(n/5)][1],
        platforms,
        coins,
        monsters,
        boss:n===9||n===19
    });
}

    totalCoins=0;
    monstersKilled=0;

    lives=3;

    swordDamage=3;

    doubleCoinsTimer=0;

    jumpBoost=0;
    speedBoost=0;

        :0;

// =====================================================

function loadLevel(n){

    level=n;

    shopOpen=false;

    const L=levels[level];

    const maxHP=
        20+
        level*10;

    player={
        x:80,
        y:250,
        width:34,
        height:48,
        vx:0,
        vy:0,
        speed:7+speedBoost,
        jumpPower:-13-jumpBoost,
        ground:false,
        maxHP:maxHP,
        hp:maxHP,
        attackCooldown:0,
        attacking:false,
        attackTimer:0
    };

    coins=L.coins.map(c=>({
        x:c[0],
        y:c[1],
        collected:false
    }));

    enemies=[];

    for(const data of L.monsters){

        const s=monsterStats(data.type);
        const p=L.platforms[data.platformIndex];

        enemies.push({
            x:Math.max(
                p[0]+5,
                Math.min(
                    data.x,
                    p[0]+p[2]-s.width-5
                )
            ),
            y:p[1]-s.height,
            width:s.width,
            height:s.height,
            type:data.type,
            hp:s.hp,
            maxHP:s.hp,
            damage:s.damage,
            rate:s.rate,
            speed:s.speed,
            color:s.color,
            coins:s.coins,
            vx:0,
            vy:0,
            ground:true,
            active:false,
            attackTimer:0,
            dead:false,
            boss:false
        });
    }


    // =================================================
    // BOSS
    // =================================================

    if(L.boss){

        const final=L.platforms[L.platforms.length-1];
        const solar=level===19;

        const bw=solar?204:170;
        const bh=solar?288:240;

        enemies.push({
            x:final[0]+final[2]-bw-70,
            y:final[1]-bh,
            width:bw,
            height:bh,

            hp:solar?50:35,
            maxHP:solar?50:35,

            damage:solar?30:20,
            rate:solar?3.5:3,

            boss:true,
            bossName:solar?"THE SOLAR":"THE OMEGA",

            active:false,
            attackTimer:0,
            warning:false,
            warningTimer:0,

            vx:0,
            vy:0,
            ground:true,
            dead:false
        });
    }


    // =================================================
    // PORTAL
    // =================================================

    const final=L.platforms[L.platforms.length-1];

    portal={
        x:final[0]+final[2]-90,
        y:final[1]-75,
        width:50,
        height:75
    };


    // =================================================
    // SHOP EVERY 5 LEVELS
    // =================================================

    if((level+1)%5===0){

        shop={
            x:final[0]+190,
            y:final[1]-70,
            width:70,
            height:70
        };

        createShop();

    }else{
        shop=null;
        shopItems=[];
    }

    camera=0;

    message=
        L.boss
        ?"⚠ "+(level===19?"THE SOLAR":"THE OMEGA")+"!"
        :L.name+" — LEVEL "+(level+1);

    messageTimer=100;
}


// =====================================================
// SHOP ROLL
// =====================================================

function createShop(){

    shopItems=[];

    // The shop contains exactly 3 slots.
    // Bought items NEVER refill the current shop.

    const available=[
        ...shopPool,
        ...weaponPool
    ].filter(item=>{
        if(!item.repeat &&
           purchasedPermanent.has(item.id))
            return false;

        return true;
    });


    // Weapon chances are weighted independently.
    // Only ONE weapon can appear in a shop.

    const weapons=available.filter(x=>x.damage);
    const nonWeapons=available.filter(x=>!x.damage);

    if(weapons.length){

        const roll=Math.random();

        let total=0;
        let chosen=null;

        for(const weapon of weapons){

            total+=weapon.chance;

            if(roll<total){
                chosen=weapon;
                break;
            }
        }

        // If the roll misses the tiny weapon probabilities,
        // no weapon is forced into the shop.

        if(chosen)
            shopItems.push(chosen);
    }


    // Fill remaining slots with regular shop items.

    const shuffled=[...nonWeapons]
        .sort(()=>Math.random()-.5);

    for(const item of shuffled){

        if(shopItems.length>=3)
            break;

        if(
            !shopItems.some(
                x=>x.id===item.id
            )
        )
            shopItems.push(item);
    }


    // Shuffle the three slots.

    shopItems.sort(
        ()=>Math.random()-.5
    );
}


// =====================================================

// =====================================================

function getShopOpenButton(){
    return {
        x:W/2-115,
        y:H-155,
        w:230,
        h:60
    };
}

function handleShopTouch(p){

    if(!shopOpen)return;

    const cardW=Math.min(200,(W-50)/3);
    const gap=10;
    const total=cardW*3+gap*2;
    const start=W/2-total/2;

    for(let i=0;i<shopItems.length;i++){

        const x=start+i*(cardW+gap);
        const y=145;

        const buy={
            x:x+10,
            y:y+170,
            w:cardW-20,
            h:55
        };

        if(inside(p,buy)){
            buyShopItem(i);
            return;
        }
    }

    const close={
        x:W/2-85,
        y:H-90,
        w:170,
        h:55
    };

    if(inside(p,close))
        shopOpen=false;
}


// =====================================================
// BUY ITEM
// =====================================================

function buyShopItem(index){

    const item=shopItems[index];

    if(!item)return;

    if(score<item.price){
        message="❌ NOT ENOUGH COINS!";
        messageTimer=55;
        return;
    }

    score-=item.price;


    if(item.id==="life"){
        lives++;
        message="❤️ +1 LIFE!";
    }

    else if(item.id==="heal"){

        if(player.hp>=player.maxHP){

            score+=item.price;

            message="❤️ HP IS ALREADY FULL!";
            messageTimer=55;
            return;
        }

        player.hp=Math.min(
            player.maxHP,
            player.hp+10
        );

        message="💚 +10 HP!";
    }

    else if(item.id==="shield"){
        shieldCount++;
        message="🛡 SHIELD +1!";
    }

    else if(item.id==="doubleCoins"){

        doubleCoinsCount++;

        // Each purchase adds another minute.
        doubleCoinsTimer+=60;

        message="🪙 2X COINS FOR 60 SECONDS!";
    }

    else if(item.id==="jump"){

        jumpBoost+=1.5;

        purchasedPermanent.add(item.id);

        message="🦘 JUMP BOOST!";
    }

    else if(item.id==="speed"){

        speedBoost+=1;

        purchasedPermanent.add(item.id);

        message="💨 SPEED BOOST!";
    }

    else if(item.id==="strength"){

        swordDamage+=2;

        purchasedPermanent.add(item.id);

        message="💪 STRENGTH +2!";
    }

    else if(item.id==="maxhp"){

        player.maxHP+=10;
        player.hp+=10;

        purchasedPermanent.add(item.id);

        message="❤️ MAX HP +10!";
    }

    else if(item.damage){

        if(item.damage>swordDamage){

            swordDamage=item.damage;
            swordRarity=item.rarity;

            message=
                "⚔ "+item.rarity+
                " SWORD!";
        }else{
            message=
                "⚔ "+item.rarity+
                " SWORD!";
        }

        purchasedPermanent.add(item.id);
    }

    messageTimer=70;

    // IMPORTANT:
    // The slot disappears and does NOT refill.
    shopItems.splice(index,1);
}


// =====================================================
// COLLISION
// =====================================================

function collision(a,b){
    return a.x<b.x+b.width &&
           a.x+a.width>b.x &&
           a.y<b.y+b.height &&
           a.y+a.height>b.y;
}


// =====================================================
// PHYSICS
// =====================================================

function moveEntity(e,platforms){

    e.vy+=.65;

    if(e.vy>17)e.vy=17;

    const oldY=e.y;

    e.x+=e.vx;
    e.y+=e.vy;

    e.ground=false;

    for(const p of platforms){

        const plat={
            x:p[0],
            y:p[1],
            width:p[2],
            height:p[3]
        };

        if(!collision(e,plat))
            continue;

        const oldBottom=oldY+e.height;
        const newBottom=e.y+e.height;

        if(
            e.vy>=0 &&
            oldBottom<=plat.y+12 &&
            newBottom>=plat.y
        ){
            e.y=plat.y-e.height;
            e.vy=0;
            e.ground=true;
        }
        else if(e.vy<0){
            e.y=plat.y+plat.height;
            e.vy=0;
        }
    }
}


// =====================================================
// PLATFORM UNDER ENTITY
// =====================================================

function platformBelow(e,platforms){

    let result=null;
    let closest=Infinity;

    for(const p of platforms){

        const overlap=
            e.x+e.width>p[0] &&
            e.x<p[0]+p[2];

        if(!overlap)continue;

        const d=
            p[1]-(e.y+e.height);

        if(d>=-10&&d<closest){
            closest=d;
            result=p;
        }
    }

    return result;
}


// =====================================================
// PLAYER DAMAGE
// =====================================================

function damagePlayer(amount){

    if(screen!=="game")return;

    // Shield blocks one hit.
    if(shieldCount>0){

        shieldCount--;

        message="🛡 SHIELD BLOCKED THE HIT!";
        messageTimer=45;

        return;
    }

    player.hp-=amount;

    if(player.hp<=0){

        lives--;

        if(lives<=0){

            gameOver=true;
            screen="gameover";

            if(speedRun)
                speedRunEnd=performance.now();

            return;
        }

        // Respawn at beginning of current level.
        player.x=80;
        player.y=250;
        player.vx=0;
        player.vy=0;

        // Full HP after respawn.
        player.hp=player.maxHP;

        camera=0;

        message="💥 RESPAWN!";
        messageTimer=80;
    }
}


// =====================================================
// ATTACK
// =====================================================

function attack(){

    if(screen!=="game")return;

    // 0.5 second attack speed.
    if(player.attackCooldown>0)return;

    player.attackCooldown=.5;

    player.attacking=true;
    player.attackTimer=.22;

    const facing=
        player.vx<0?-1:1;

    for(const enemy of enemies){

        if(enemy.dead)continue;

        const dx=enemy.x-player.x;
        const dy=Math.abs(enemy.y-player.y);

        const inFront=
            dx*facing>=-25 &&
            dx*facing<=125;

        if(inFront&&dy<140){

            enemy.hp-=swordDamage;

            if(enemy.hp<=0){

                enemy.dead=true;
                monstersKilled++;

                // Boss coin rewards.
                let reward=1;

                if(enemy.boss){
                    reward=
                        enemy.bossName==="THE SOLAR"
                        ?20
                        :10;
                }else{
                    reward=enemy.coins;
                }

                const multiplier=
                    doubleCoinsTimer>0?2:1;

                const coinsEarned=
                    reward*multiplier;

                score+=coinsEarned;
                totalCoins+=coinsEarned;

                message=
                    "+"+coinsEarned+" COINS!";

                messageTimer=40;
            }
        }
    }
}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemy(e,L,dt){

    if(e.dead)return;


    // =================================================
    // BOSS
    // =================================================

    if(e.boss){

        if(Math.abs(player.x-e.x)<850)
            e.active=true;

        if(!e.active)return;

        // Boss stays in front of portal.
        e.vx=0;

        e.attackTimer+=dt;

        if(
            e.attackTimer>=e.rate &&
            !e.warning
        ){

            e.attackTimer=0;
            e.warning=true;
            e.warningTimer=.5;
        }

        if(e.warning){

            e.warningTimer-=dt;

            if(e.warningTimer<=0){

                e.warning=false;

                const center=e.x+e.width/2;
                const pc=player.x+player.width/2;

                if(
                    Math.abs(pc-center)<
                    e.width/2+120
                ){
                    damagePlayer(e.damage);
                }
            }
        }

        return;
    }


    // =================================================
    // NORMAL MONSTER
    // =================================================

    // Void monsters are permanently removed.
    if(e.y>H+700){
        e.dead=true;
        return;
    }

    const dx=player.x-e.x;
    const distance=Math.abs(dx);

    if(!e.active&&distance<600)
        e.active=true;

    if(!e.active)return;

    if(distance>1000){
        e.active=false;
        e.vx=0;
        return;
    }

    const dir=dx>0?1:-1;

    e.vx=dir*e.speed;

    const mp=platformBelow(e,L.platforms);
    const pp=platformBelow(player,L.platforms);

    // Jump toward higher platform.
    if(
        e.ground &&
        mp &&
        pp &&
        pp[1]<mp[1]-25
    ){
        e.vy=-12;
    }

    moveEntity(e,L.platforms);

    // Only attack while physically touching.
    if(collision(player,e)){

        e.attackTimer+=dt;

        if(e.attackTimer>=e.rate){

            e.attackTimer=0;
            damagePlayer(e.damage);
        }

    }else{
        e.attackTimer=0;
    }
}


// =====================================================
// UPDATE
// =====================================================

let lastTime=performance.now();

function update(){

    const now=performance.now();

    let dt=(now-lastTime)/1000;
    lastTime=now;

    dt=Math.min(dt,.05);

    if(screen!=="game")return;

    if(shopOpen)return;

    const L=levels[level];


    // 2X COINS TIMER.
    if(doubleCoinsTimer>0){

        doubleCoinsTimer-=dt;

        if(doubleCoinsTimer<=0){
            doubleCoinsTimer=0;
            doubleCoinsCount=0;
        }
    }


    nearShop=false;

    if(shop){

        const dx=Math.abs(player.x-shop.x);
        const dy=Math.abs(player.y-shop.y);

        nearShop=dx<180&&dy<160;
    }


    const left=keyLeft||touchLeft;
    const right=keyRight||touchRight;
    const jump=keyJump||touchJump;
    const attacking=keyAttack||touchAttack;


    if(left)player.vx-=.8;
    if(right)player.vx+=.8;

    if(!left&&!right)
        player.vx*=.82;

    player.vx=Math.max(
        -player.speed,
        Math.min(player.speed,player.vx)
    );


    if(jump&&player.ground){

        player.vy=player.jumpPower;
        player.ground=false;
    }


    if(attacking)
        attack();


    if(player.attackCooldown>0){
        player.attackCooldown-=dt;

        if(player.attackCooldown<0)
            player.attackCooldown=0;
    }

    if(player.attacking){

        player.attackTimer-=dt;

        if(player.attackTimer<=0)
            player.attacking=false;
    }


    moveEntity(player,L.platforms);

    player.x=Math.max(0,player.x);


    // COINS
    for(const c of coins){

        if(c.collected)continue;

        const d=Math.hypot(
            player.x+player.width/2-c.x,
            player.y+player.height/2-c.y
        );

        if(d<35){

            c.collected=true;

            const amount=
                doubleCoinsTimer>0?2:1;

            score+=amount;
            totalCoins+=amount;

            message="+"+amount+" COIN!";
            messageTimer=30;
        }
    }


    // ENEMIES
    for(const e of enemies)
        updateEnemy(e,L,dt);

    enemies=enemies.filter(e=>!e.dead);


    // PORTAL
    const bossAlive=
        enemies.some(e=>e.boss);

    if(
        collision(player,portal)&&
        !bossAlive
    ){

        if(level<19){

            loadLevel(level+1);

        }else{

            gameWon=true;
            screen="won";

            if(speedRun)
                speedRunEnd=performance.now();
        }
    }


    // PLAYER VOID
    if(player.y>H+500)
        damagePlayer(player.maxHP);


    // CAMERA
    const final=L.platforms[L.platforms.length-1];

    const worldWidth=
        final[0]+final[2]+150;

    camera+=(
        player.x-W*.35-camera
    )*.1;

    camera=Math.max(
        0,
        Math.min(
            Math.max(0,worldWidth-W),
            camera
        )
    );


    if(messageTimer>0)
        messageTimer--;
}


// =====================================================
// DRAW
// =====================================================

function draw(){

    if(screen==="start"){
        drawStartScreen();
        return;
    }

    if(screen==="gameover"||screen==="won"){
        drawWorld();
        drawEndScreen();
        return;
    }

    drawWorld();
}


function drawWorld(){

    const L=levels[level];

    const gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,L.sky1);
    gradient.addColorStop(1,L.sky2);

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(-camera,0);


    // BACKGROUND
    ctx.fillStyle="rgba(255,255,255,.13)";

    for(let i=-2;i<20;i++){

        ctx.beginPath();

        ctx.moveTo(i*600,700);
        ctx.lineTo(i*600+300,180);
        ctx.lineTo(i*600+650,700);

        ctx.fill();
    }


    // PLATFORMS
    for(const p of L.platforms){

        ctx.fillStyle="#263244";

        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            p[3]
        );

        ctx.fillStyle=
            level>=15
            ?"#fb923c"
            :"#22c55e";

        ctx.fillRect(
            p[0],
            p[1],
            p[2],
            7
        );
    }


    // SHOP
    if(shop){

        ctx.fillStyle="#78350f";

        ctx.fillRect(
            shop.x,
            shop.y,
            shop.width,
            shop.height
        );

        ctx.fillStyle="#fbbf24";

        ctx.fillRect(
            shop.x-8,
            shop.y-18,
            shop.width+16,
            22
        );

        ctx.fillStyle="white";
        ctx.font="bold 18px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "SHOP",
            shop.x+shop.width/2,
            shop.y+45
        );

        ctx.textAlign="left";
    }


    // COINS
    for(const c of coins){

        if(c.collected)continue;

        ctx.fillStyle="#facc15";

        ctx.beginPath();

        ctx.arc(
            c.x,
            c.y,
            11,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    // MONSTERS
    for(const e of enemies){

        if(e.boss){
            drawBoss(e);
            continue;
        }

        ctx.fillStyle=e.color;

        ctx.fillRect(
            e.x,
            e.y,
            e.width,
            e.height
        );

        ctx.fillStyle="#111827";

        ctx.fillRect(
            e.x+e.width*.2,
            e.y+e.height*.2,
            7,
            7
        );

        ctx.fillRect(
            e.x+e.width*.6,
            e.y+e.height*.2,
            7,
            7
        );

        drawHealth(
            e.x,
            e.y-14,
            e.width,
            7,
            e.hp,
            e.maxHP
        );
    }


    // PORTAL
    const bossAlive=
        enemies.some(e=>e.boss);

    ctx.fillStyle="white";

    ctx.fillRect(
        portal.x,
        portal.y,
        7,
        portal.height
    );

    ctx.fillStyle=
        bossAlive
        ?" #64748b"
        :" #a855f7";

    ctx.fillStyle=ctx.fillStyle.trim();

    ctx.beginPath();

    ctx.moveTo(
        portal.x+7,
        portal.y
    );

    ctx.lineTo(
        portal.x+65,
        portal.y+20
    );

    ctx.lineTo(
        portal.x+7,
        portal.y+40
    );

    ctx.closePath();

    ctx.fill();


    // PLAYER
    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle="white";

    ctx.fillRect(
        player.x+6,
        player.y+10,
        7,
        7
    );

    ctx.fillRect(
        player.x+20,
        player.y+10,
        7,
        7
    );


    // SWORD SLASH
    if(player.attacking){

        ctx.save();

        const facing=
            player.vx<0?-1:1;

        ctx.translate(
            player.x+player.width/2,
            player.y+player.height/2
        );

        const progress=
            1-player.attackTimer/.22;

        ctx.rotate(
            facing*
            (-1.1+progress*2.2)
        );

        drawSword();

        ctx.restore();
    }


    // BOSS WARNING
    for(const e of enemies){

        if(e.boss&&e.warning){

            ctx.fillStyle="rgba(255,0,0,.3)";

            ctx.fillRect(
                e.x-120,
                e.y+e.height-18,
                e.width+240,
                35
            );

            ctx.fillStyle="white";
            ctx.font="bold 20px Arial";

            ctx.fillText(
                "⚠ INCOMING ATTACK!",
                e.x-70,
                e.y-25
            );
        }
    }

    ctx.restore();


    drawHUD();
    drawControls();


    if(
        nearShop &&
        !shopOpen
    ){

        const b=getShopOpenButton();

        ctx.fillStyle="rgba(0,0,0,.75)";

        ctx.fillRect(
            b.x,b.y,b.w,b.h
        );

        ctx.strokeStyle="#fbbf24";
        ctx.lineWidth=3;

        ctx.strokeRect(
            b.x,b.y,b.w,b.h
        );

        ctx.fillStyle="white";
        ctx.textAlign="center";
        ctx.font="bold 20px Arial";

        ctx.fillText(
            "🏪 TAP TO SHOP",
            W/2,
            b.y+39
        );

        ctx.textAlign="left";
    }


    if(messageTimer>0){

        ctx.fillStyle="rgba(0,0,0,.65)";

        ctx.fillRect(
            W/2-155,
            125,
            310,
            55
        );

        ctx.fillStyle="white";
        ctx.textAlign="center";
        ctx.font="bold 20px Arial";

        ctx.fillText(
            message,
            W/2,
            160
        );

        ctx.textAlign="left";
    }


    if(shopOpen)
        drawShop();
}


// =====================================================
// SWORD
// =====================================================

function swordColor(){

    if(swordRarity==="COMMON")
        return "#9ca3af";

    if(swordRarity==="UNCOMMON")
        return "#22c55e";

    if(swordRarity==="RARE")
        return "#3b82f6";

    if(swordRarity==="EPIC")
        return "#a855f7";

    if(swordRarity==="LEGENDARY")
        return "#facc15";

    if(swordRarity==="MYTHIC")
        return "#ef4444";

    if(swordRarity==="SECRET")
        return "#ef4444";

    // Eternal: red middle, black outside.
    if(swordRarity==="???")
        return "#ef4444";

    return "#9ca3af";
}

function drawSword(){

    // Eternal sword special design.
    if(swordRarity==="???"){

        ctx.fillStyle="#050505";

        ctx.fillRect(
            5,-8,
            70,16
        );

        ctx.fillStyle="#ef4444";

        ctx.fillRect(
            8,-3,
            64,6
        );

    }else{

        ctx.fillStyle=swordColor();

        ctx.fillRect(
            5,-5,
            65,10
        );
    }

    ctx.fillStyle="#78350f";

    ctx.fillRect(
        -10,-4,
        20,8
    );
}

function drawBoss(b){

        b.x,
        b.y,

        ctx.fillStyle="#facc15";

        ctx.font="bold 25px Arial";

        ctx.fillText(
            "⏱ SPEED RUN TIME: "+
            formatTime(finalTime),
            W/2,
            H/2+48
        );
    }


    const retry=getRetryButton();

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        retry.x,
        retry.y,
        retry.w,
        retry.h
    );

    ctx.fillStyle="white";

    ctx.font="bold 22px Arial";

    ctx.fillText(
        "🔄 PLAY AGAIN",
        W/2,
        retry.y+42
    );


    const home=getHomeButton();

    ctx.fillStyle="#475569";

    ctx.fillRect(
        home.x,
        home.y,
        home.w,
        home.h
    );

    ctx.fillStyle="white";

    ctx.font="bold 20px Arial";

    ctx.fillText(
        "⌂ MAIN MENU",
        W/2,
        home.y+39
    );

    ctx.textAlign="left";
}


// =====================================================
// TIMER
// =====================================================

function formatTime(seconds){

    const mins=Math.floor(seconds/60);
    const secs=Math.floor(seconds%60);
    const ms=Math.floor((seconds%1)*1000);

    return String(mins).padStart(2,"0")+
        ":"+
        String(secs).padStart(2,"0")+
        "."+
        String(ms).padStart(3,"0");
}


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
